name = "goodflippindesign"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages requires this to treat wrangler.toml as valid configuration.
# Our build outputs static assets in the repo root.
pages_build_output_dir = "."

# Cloudflare D1 Database (Phase 3: Community Features)
[[d1_databases]]
binding = "DB"
database_name = "gfd_community"
database_id = "a46ec9df-31b8-4285-845b-1fd3a62bd1b5"

# Cloudflare R2 — media asset storage (10 GB free, zero egress)
# Create bucket: wrangler r2 bucket create gfv-media
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "gfv-media"

# Cloudflare Workers AI — free tier: 10,000 neurons/day (Llama 3, Mistral 7B, etc.)
# Activated 2026-03-23 for AI Utilities panel caption generation
[ai]
binding = "AI"

# Environment variables (build config in Cloudflare dashboard)
[vars]
NODE_ENV = "production"
# SOCIAL_PUBLISHER_URL — deployed 2026-03-23, set as Pages secret
# Value: https://gfv-social-publisher.weave0.workers.dev
# Worker deployed with: npm run deploy:social

# Secrets (set via: wrangler secret put <NAME>)
# STRIPE_WEBHOOK_SECRET   — Stripe webhook signing secret (get from Stripe Dashboard → Webhooks → your endpoint → Signing secret)
#                           Webhook URL to register: https://goodflippindesign.com/api/stripe/webhook
#                           Events to subscribe: payment_intent.succeeded, payment_intent.payment_failed, charge.refunded
# SENTRY_DSN              — Error tracking (get from sentry.io dashboard)
# CLERK_SECRET_KEY        — Auth (get from dashboard.clerk.com)
# TOKEN_ENCRYPTION_KEY    — 32+ char random string for AES-GCM token/state encryption
# OPENAI_API_KEY          — Required for Content Studio DALL-E 3 image generation
#
# Feature flags (optional — default ON in production, set to 'false' to disable):
# ENABLE_COMMUNITY        — Community portal features (default: true)
# ENABLE_BLOG_CMS         — Blog CMS editor on public site (default: true)
# ENABLE_DONATIONS        — Donation page and widgets (default: true)
# ENABLE_AI_FEATURES      — AI generation features (default: false, set 'true' to enable)
#
# OAuth secrets (required for seamless platform connections in admin panel):
# META_APP_ID             — 882897501450706 (Meta Developer Console → your app → Settings → Basic)
# META_APP_SECRET         — from Meta Developer Console (Settings → Basic → Show)
# X_CLIENT_ID             — from X Developer Portal
# X_CLIENT_SECRET         — from X Developer Portal
# LINKEDIN_CLIENT_ID      — from LinkedIn Developer Console
# LINKEDIN_CLIENT_SECRET  — from LinkedIn Developer Console
# PINTEREST_APP_ID        — from Pinterest Developer Console
# PINTEREST_APP_SECRET    — from Pinterest Developer Console
# TIKTOK_CLIENT_KEY       — from TikTok Developer Console
# TIKTOK_CLIENT_SECRET    — from TikTok Developer Console
# GOOGLE_CLIENT_ID        — from Google Cloud Console (YouTube)
# GOOGLE_CLIENT_SECRET    — from Google Cloud Console (YouTube)
# THREADS_APP_ID          — from Meta Developer Console (Threads product, App ID: 1248220120837224)
# THREADS_APP_SECRET      — from Meta Developer Console (Threads product → Settings → Basic → Show)

# Note: Security headers are configured in _headers file
# Cloudflare Pages automatically applies headers from _headers file
# See _headers in project root for CSP, X-Frame-Options, etc.
