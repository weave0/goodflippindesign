name: Connect GitHub to Cloudflare Pages

on:
    workflow_dispatch: # Manual trigger

jobs:
    connect-git:
        name: Connect Git Integration
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Delete and Recreate Project with GitHub Integration
              env:
                  CF_API_TOKEN: ${{ secrets.CF_FULL_ITHINK }}
                  CF_ACCOUNT_ID: 3253d907ea85a18eb442283d7308b193
                  CF_PROJECT_NAME: goodflippindesign
                  GITHUB_REPO: weave0/goodflippindesign
              run: |
                  echo "🗑️  Step 1: Removing custom domains from project..."
                  echo ""

                  # Get all custom domains
                  DOMAINS_RESPONSE=$(curl -s -X GET \
                    "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/domains" \
                    -H "Authorization: Bearer $CF_API_TOKEN")

                  # Delete each custom domain
                  echo "$DOMAINS_RESPONSE" | jq -r '.result[].name' | while read domain; do
                    if [ ! -z "$domain" ]; then
                      echo "🗑️  Removing domain: $domain"
                      curl -s -X DELETE \
                        "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/domains/$domain" \
                        -H "Authorization: Bearer $CF_API_TOKEN" > /dev/null
                      echo "✅ Removed: $domain"
                    fi
                  done

                  echo ""
                  echo "⏳ Waiting 3 seconds..."
                  sleep 3
                  echo ""

                  echo "🗑️  Step 2: Deleting existing Direct Upload project..."
                  echo "   Project: $CF_PROJECT_NAME"
                  echo ""

                  # Delete existing project
                  DELETE_RESPONSE=$(curl -s -X DELETE \
                    "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME" \
                    -H "Authorization: Bearer $CF_API_TOKEN")

                  if [ "$(echo $DELETE_RESPONSE | jq -r '.success')" = "true" ]; then
                    echo "✅ Old project deleted successfully"
                  else
                    echo "⚠️  Delete response:"
                    echo "$DELETE_RESPONSE" | jq '.'
                  fi

                  echo ""
                  echo "⏳ Waiting 5 seconds for deletion to propagate..."
                  sleep 5
                  echo ""

                  echo "🔗 Step 3: Creating new project with GitHub integration..."
                  echo "   Repository: $GITHUB_REPO"
                  echo "   Production branch: main"
                  echo ""

                  # Create new project with GitHub source
                  CREATE_RESPONSE=$(curl -s -X POST \
                    "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects" \
                    -H "Authorization: Bearer $CF_API_TOKEN" \
                    -H "Content-Type: application/json" \
                    -d '{
                      "name": "goodflippindesign",
                      "production_branch": "main",
                      "build_config": {
                        "build_command": "npm run build",
                        "destination_dir": ".",
                        "root_dir": ""
                      },
                      "deployment_configs": {
                        "production": {
                          "compatibility_date": "2024-01-01",
                          "env_vars": {}
                        }
                      },
                      "source": {
                        "type": "github",
                        "config": {
                          "owner": "weave0",
                          "repo_name": "goodflippindesign",
                          "production_branch": "main",
                          "pr_comments_enabled": true,
                          "deployments_enabled": true
                        }
                      }
                    }')

                  echo "$CREATE_RESPONSE" | jq '.'

                  if [ "$(echo $CREATE_RESPONSE | jq -r '.success')" = "true" ]; then
                    echo ""
                    echo "✅ ✅ ✅ SUCCESS! GitHub connected to Cloudflare Pages! ✅ ✅ ✅"
                    echo ""
                    echo "📋 New Project Configuration:"
                    echo "   Name: goodflippindesign"
                    echo "   Source: GitHub"
                    echo "   Repository: $GITHUB_REPO"
                    echo "   Production branch: main"
                    echo "   Build command: npm run build"
                    echo "   Output directory: ."
                    echo ""
                    echo "🚀 First deployment will trigger automatically from GitHub!"
                    echo ""

                    # Re-add custom domain
                    echo "🌐 Step 4: Re-adding custom domain..."
                    DOMAIN_RESPONSE=$(curl -s -X POST \
                      "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/domains" \
                      -H "Authorization: Bearer $CF_API_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d '{
                        "name": "www.goodflippindesign.com"
                      }')

                    if [ "$(echo $DOMAIN_RESPONSE | jq -r '.success')" = "true" ]; then
                      echo "✅ Custom domain re-added: www.goodflippindesign.com"
                    else
                      echo "⚠️  Domain re-add response:"
                      echo "$DOMAIN_RESPONSE" | jq '.'
                    fi

                    echo ""
                    echo "🌐 Monitor deployment at: https://dash.cloudflare.com/$CF_ACCOUNT_ID/pages/view/$CF_PROJECT_NAME"
                  else
                    echo ""
                    echo "❌ Failed to create project with GitHub integration"
                    echo ""

                    ERRORS=$(echo $CREATE_RESPONSE | jq -r '.errors[]?.message' 2>/dev/null)
                    if [ ! -z "$ERRORS" ]; then
                      echo "Errors:"
                      echo "$ERRORS"
                      echo ""
                    fi

                    exit 1
                  fi

            - name: Wait for deployment
              run: |
                  echo "⏳ Waiting 2 minutes for deployment to complete..."
                  sleep 120

            - name: Verify deployment
              run: |
                  echo "🧪 Checking deployed site..."

                  CACHE_BUST=$(curl -s https://goodflippindesign.pages.dev/ | grep -oP '<!-- Cache bust: \K[0-9-:]+' || echo "not found")
                  echo "📅 Live cache bust: $CACHE_BUST"

                  EXPECTED_BUST=$(grep -oP '<!-- Cache bust: \K[0-9-:]+' index.html)
                  echo "📅 Expected cache bust: $EXPECTED_BUST"

                  if [ "$CACHE_BUST" = "$EXPECTED_BUST" ]; then
                    echo ""
                    echo "✅ ✅ ✅ SUCCESS! Site is LIVE with fresh code! ✅ ✅ ✅"
                    echo ""
                    echo "🎉 Your donations page is now working!"
                    echo "🌐 Visit: https://www.goodflippindesign.com/donate.html"
                  else
                    echo ""
                    echo "⏳ Deployment in progress or needs more time..."
                    echo "🔄 Check again in a few minutes at:"
                    echo "   https://goodflippindesign.pages.dev/"
                  fi
