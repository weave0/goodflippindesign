name: CI - Tests (Cost Optimized)

on:
  pull_request:
    branches: [main]
  # Removed push trigger - Cloudflare Pages handles deployment (free)

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Cost control: max 10 minutes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Sync index.html → temp_review.html
        run: cp index.html temp_review.html

      - name: Verify CSP headers are up to date
        run: |
          node scripts/generate-csp.js
          git diff --exit-code _headers || (
            echo ""
            echo "❌ _headers is out of sync with scripts/csp-config.js"
            echo "   Run: npm run gen:csp  then commit _headers"
            exit 1
          )

      - name: Run Tests
        run: npm test
