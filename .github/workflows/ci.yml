name: CI - Tests (Cost Optimized)

on:
  pull_request:
    branches: [main]
  # Removed push trigger - Cloudflare Pages handles deployment (free)

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Cost control: max 10 minutes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm install --no-audit --ignore-scripts && npx puppeteer browsers install chrome
        # npm ci fails cross-platform: Windows lockfile omits Linux-only
        # @emnapi/core + @emnapi/runtime (optional deps of @napi-rs/canvas)

      - name: Lint
        run: npm run lint

      - name: Sync index.html → temp_review.html
        run: cp index.html temp_review.html

      - name: Verify CSP headers are up to date
        run: |
          node scripts/generate-csp.js
          git diff --exit-code _headers || (
            echo ""
            echo "❌ _headers is out of sync with scripts/csp-config.js"
            echo "   Run: npm run gen:csp  then commit _headers"
            exit 1
          )

      - name: Run Tests
        run: npm test

      - name: Verify pre-commit hook boundary
        run: npm run verify:hook-boundary
        # Enforces the fix for the bug where .husky/pre-commit regenerated
        # CultureSherpa's CSP output as a side effect of committing to this
        # repo. Runs the hook for real in an isolated throwaway git worktree
        # and fails the job if it ever creates a foreign-project directory
        # again — this must stay a hard CI gate, not just a manual script.

  # Split out from "Run Tests" so a known, tracked set of dependency
  # vulnerabilities cannot silently prevent lint/CSP/test correctness from
  # ever being reported. This job intentionally runs independently (no
  # `needs:`) and its audit step intentionally continues on error: the
  # result must stay fully visible in Actions, not disappear or block merge
  # decisions before the dependency debt itself is triaged and addressed.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm install --no-audit --ignore-scripts
        # No puppeteer browser download needed here — this job doesn't run tests.

      - name: Security audit (informational — see job comment)
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Flag dependency vulnerabilities
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::warning title=Dependency vulnerabilities found::npm audit reported moderate-or-higher vulnerabilities. See the Security audit step log above for full detail. This job is intentionally non-blocking; the debt itself is not remediated by this workflow."
          {
            echo "### :warning: Dependency vulnerabilities found"
            echo ""
            echo "\`npm audit --audit-level=moderate\` reported moderate-or-higher vulnerabilities in this job. See the **Security audit** step log above for full detail."
            echo ""
            echo "This job is intentionally non-blocking — the debt itself is not remediated by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
