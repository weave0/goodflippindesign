name: CI - Tests (Cost Optimized)

on:
  pull_request:
    branches: [main]
  # Removed push trigger - Cloudflare Pages handles deployment (free)

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Cost control: max 10 minutes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci --no-audit --ignore-scripts && npx puppeteer browsers install chrome

      - name: Test security policy
        run: npm run test:security

      - name: Production security audit
        run: |
          node scripts/check-production-graph.js
          npm audit --omit=dev --omit=optional --audit-level=moderate

      - name: Governed full-tree security audit
        run: |
          set +e
          npm audit --audit-level=moderate --json > npm-audit-full.json
          audit_status=$?
          set -e
          node scripts/audit-policy.js npm-audit-full.json security/npm-audit-baseline.json "$audit_status"
          base_sha="${{ github.event.pull_request.base.sha }}"
          trusted_baseline="$(mktemp)"
          if [ -n "$base_sha" ]; then
            git fetch --no-tags origin "$base_sha" --depth=1
          fi
          if [ -n "$base_sha" ] && git cat-file -e "$base_sha:security/npm-audit-baseline.json" 2>/dev/null; then
            git show "$base_sha:security/npm-audit-baseline.json" > "$trusted_baseline"
          fi
          node scripts/compare-audit-baseline.js security/npm-audit-baseline.json "$trusted_baseline" npm-audit-full.json
          echo "npm audit exit status: $audit_status (1 means findings were reported and validated)"

      - name: Validate canonical estate registry
        run: npm run estate:validate

      - name: Estate registry hostile validation tests
        run: node tests/estate-registry-validation.test.mjs

      - name: Property promotion gate tests
        run: node --no-warnings tests/property-promotion-gate.test.mjs

      - name: Estate property readiness report tests
        run: node --no-warnings tests/estate-property-readiness-report.test.mjs

      - name: Estate cohort plan tests
        run: node --no-warnings tests/estate-cohort-plan.test.mjs

      - name: Mission Control provenance, topology, evidence and preflight tests
        run: |
          node --no-warnings tests/pages-release-stamp.test.mjs
          node --no-warnings tests/mc-topology.test.mjs
          node --no-warnings tests/mc-production-preflight.test.mjs
          node --no-warnings tests/fwomps-host-identity.test.mjs
          node --no-warnings tests/mc-revision-evidence.test.mjs
          node --no-warnings tests/mc-canary-operator-auth.test.mjs
          node --no-warnings tests/mc-off-proof.test.mjs
          node --no-warnings tests/mc-pages-redeploy.test.mjs
          node --no-warnings tests/mc-delivery-bearer.test.mjs
          node --no-warnings tests/property-gap-diagnostics.test.mjs

      - name: Validate TI work-sync live authority contract
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const workflow = fs.readFileSync(".github/workflows/ti-work-sync.yml", "utf8");
          if (!workflow.includes("CLOUDFLARE_ACCOUNT_ID: 3253d907ea85a18eb442283d7308b193")) {
            throw new Error("ti-work-sync must expose CLOUDFLARE_ACCOUNT_ID to the production producer");
          }
          if (!workflow.includes("Verify live Cloudflare acquisition authority")) {
            throw new Error("ti-work-sync must fail explicitly before acquisition when live authority is incomplete");
          }
          if (workflow.includes("\n  CF_ACCOUNT_ID:")) {
            throw new Error("ti-work-sync must not use the producer-incompatible CF_ACCOUNT_ID name");
          }
          console.log("ti_work_sync_live_authority_contract=true");
          NODE

      - name: Lint
        run: npm run lint

      - name: Sync index.html → temp_review.html
        run: cp index.html temp_review.html

      - name: Verify CSP headers are up to date
        run: |
          node scripts/generate-csp.js
          git diff --exit-code _headers || (
            echo ""
            echo "❌ _headers is out of sync with scripts/csp-config.js"
            echo "   Run: npm run gen:csp  then commit _headers"
            exit 1
          )

      - name: Run Tests
        run: npm test

      - name: Verify pre-commit project boundary
        run: npm run verify:hook-boundary

      - name: Run governed Worker tests
        run: |
          npm run test:workers:mission-control-events
          npm run test:workers:mission-control-core
          npm run test:workers:mission-control
          npm run test:workers:mission-control-off-proof
          npm run test:workers:payments
          npm run test:workers:stripe-webhook
          npm run test:workers:social-publisher

      - name: Install Traffic Intelligence
        run: npm ci --prefix traffic-intelligence --no-audit

      - name: Validate Traffic Intelligence
        run: |
          npm run traffic:lint
          npm run traffic:test
          npm run traffic:build
          test -f traffic-intelligence/dist/index.html
          test -f traffic-intelligence/dist/gold/canonical-gold-m1.2.json
