name: Deploy Health Sweep Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/health-sweep.js"
      - "workers/wrangler-health-sweep.toml"
      - "config/health-targets.json"
      - ".github/workflows/deploy-health-sweep-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-health-sweep-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy gfd-health-sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci --no-audit --ignore-scripts

      - name: Validate health worker tests
        run: npx vitest run --config vitest.workers.config.mjs tests/workers/health-sweep.test.js

      - name: Require Cloudflare deploy token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured for this repository."
            exit 1
          fi

      - name: Deploy health sweep Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3253d907ea85a18eb442283d7308b193
          command: deploy --config workers/wrangler-health-sweep.toml

      - name: Verify deployed Worker metadata
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node - <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = '3253d907ea85a18eb442283d7308b193';
          const url = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/gfd-health-sweep/settings`;
          const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
          if (!res.ok) throw new Error(`Cloudflare settings lookup failed: ${res.status}`);
          const body = await res.json();
          if (!body.success) throw new Error(`Cloudflare settings lookup failed: ${JSON.stringify(body.errors)}`);
          const bindings = new Map((body.result?.bindings || []).map(b => [b.name, b.type]));
          if (bindings.get('DB') !== 'd1') throw new Error('DB D1 binding missing after deploy');
          if (bindings.get('GITHUB_TOKEN') !== 'secret_text') throw new Error('GITHUB_TOKEN secret binding missing after deploy');
          console.log('health_worker_bindings_verified=true');
          console.log('compatibility_date=' + body.result?.compatibility_date);
          NODE


      - name: Trigger and verify fresh production sweep
        shell: bash
        run: |
          node - <<'NODE'
          const triggerUrl = 'https://gfd-health-sweep.weave0.workers.dev/trigger';
          const lastUrl = 'https://gfd-health-sweep.weave0.workers.dev/last';
          const started = Date.now();

          const trigger = await fetch(triggerUrl);
          let triggerBody = null;
          try { triggerBody = await trigger.json(); } catch {}

          if (!(trigger.ok || trigger.status === 429)) {
            throw new Error(`health sweep trigger failed: ${trigger.status} ${JSON.stringify(triggerBody)}`);
          }

          if (trigger.status === 429) {
            const retryAfter = Number(trigger.headers.get('retry-after') || triggerBody?.retry_after_seconds || 0);
            if (retryAfter > 90) {
              throw new Error(`health sweep is rate-limited for too long to verify this deploy: ${retryAfter}s`);
            }
            await new Promise(resolve => setTimeout(resolve, Math.max(retryAfter, 1) * 1000));
            const retry = await fetch(triggerUrl);
            if (!retry.ok) throw new Error(`health sweep retrigger failed: ${retry.status}`);
          }

          const deadline = Date.now() + 90_000;
          while (Date.now() < deadline) {
            await new Promise(resolve => setTimeout(resolve, 5000));
            const response = await fetch(lastUrl, { headers: { 'cache-control': 'no-cache' } });
            if (!response.ok) throw new Error(`health sweep evidence read failed: ${response.status}`);
            const rows = await response.json();
            const aia = rows.find(row =>
              row.brand === 'aiaimate' &&
              row.content_keyword === 'machine:gfd-property-health' &&
              Date.parse(row.checked_at) >= started - 5000
            );
            if (!aia) continue;

            console.log('aiaimate_checked_at=' + aia.checked_at);
            console.log('aiaimate_keyword_found=' + aia.keyword_found);
            console.log('aiaimate_overall_status=' + aia.overall_status);

            if (Number(aia.keyword_found) !== 1) {
              throw new Error(`AIAIMate machine health contract did not match: ${JSON.stringify(aia)}`);
            }
            if (aia.overall_status !== 'pass') {
              throw new Error(`AIAIMate fresh production health is not pass: ${JSON.stringify(aia)}`);
            }

            console.log('fresh_production_health_verified=true');
            process.exit(0);
          }

          throw new Error('Timed out waiting for fresh post-deploy health evidence in D1');
          NODE
