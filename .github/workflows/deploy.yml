name: Deploy to Cloudflare Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

# Cloudflare Pages handles deployment automatically via GitHub integration
# This workflow is for manual triggers and additional deployment steps

jobs:
    pre-deploy:
        name: Pre-deployment Checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build and optimize
              run: npm run build

            - name: Run tests
              run: npm test

            - name: Verify files in sync
              run: |
                  if ! diff -q index.html temp_review.html > /dev/null 2>&1; then
                    echo "❌ Files out of sync after build!"
                    exit 1
                  fi
                  echo "✅ All files synced"

            - name: Check cache bust
              run: |
                  CACHE_BUST=$(grep -oP '<!-- Cache bust: \K[0-9-:]+' index.html)
                  echo "Cache bust timestamp: $CACHE_BUST"

    # Cloudflare Pages deploys automatically when connected to GitHub
