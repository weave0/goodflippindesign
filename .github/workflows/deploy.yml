name: Deploy to Production

on:
    push:
        branches: [main]
    workflow_dispatch: # Manual trigger

jobs:
    deploy:
        name: Build & Deploy
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Update cache bust timestamp
              run: |
                  TIMESTAMP=$(date -u +"%Y-%m-%d-%H:%M")
                  echo "Cache updated $(date -u +"%m/%d/%Y %H:%M:%S")" > cache-bust.txt
                  sed -i "s/<!-- Cache bust: .* -->/<!-- Cache bust: $TIMESTAMP -->/" index.html

            - name: Sync to temp_review.html
              run: cp index.html temp_review.html

            - name: Run tests before deploy
              run: node tests/run-all-tests.js

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/pages-action@v1
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  projectName: good-flippin-design
                  directory: .
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit updated cache bust
              if: success()
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add cache-bust.txt index.html temp_review.html
                  git diff --quiet && git diff --staged --quiet || git commit -m "chore: update cache bust timestamp [skip ci]"
                  git push
