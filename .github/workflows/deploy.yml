name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cloudflare Pages handles deployment automatically via GitHub integration.
# This workflow provides a lightweight sanity gate on every push to main.
# Full Puppeteer tests already run in ci.yml on every PR — no need to repeat them here.

jobs:
  pre-deploy:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Cost control

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --ignore-scripts && npx puppeteer browsers install chrome

      - name: Test security policy
        run: npm run test:security

      - name: Production security audit
        run: |
          node scripts/check-production-graph.js
          npm audit --omit=dev --omit=optional --audit-level=moderate

      - name: Governed full-tree security audit
        run: |
          set +e
          npm audit --audit-level=moderate --json > npm-audit-full.json
          audit_status=$?
          set -e
          node scripts/audit-policy.js npm-audit-full.json security/npm-audit-baseline.json "$audit_status"
          base_sha="${{ github.event.before }}"
          trusted_baseline="$(mktemp)"
          if [ -n "$base_sha" ]; then
            git fetch --no-tags origin "$base_sha" --depth=1
          fi
          if [ -n "$base_sha" ] && git cat-file -e "$base_sha:security/npm-audit-baseline.json" 2>/dev/null; then
            git show "$base_sha:security/npm-audit-baseline.json" > "$trusted_baseline"
          fi
          node scripts/compare-audit-baseline.js security/npm-audit-baseline.json "$trusted_baseline" npm-audit-full.json
          echo "npm audit exit status: $audit_status (1 means findings were reported and validated)"

      - name: Lint
        run: npm run lint

      - name: Build and sync
        run: npm run build # cache-bust + sync index → temp_review

      - name: Verify CSP headers are up to date
        run: |
          node scripts/generate-csp.js
          git diff --exit-code _headers || (
            echo "❌ _headers is out of sync with scripts/csp-config.js"
            echo "   Run: npm run gen:csp  then commit _headers"
            exit 1
          )

      - name: Quick accessibility smoke test
        run: node tests/accessibility.test.js

      - name: Verify cache bust is present
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const match = html.match(/<!-- Cache bust: ([\d\-:]+) -->/);
            if (!match) { console.error('Cache bust comment missing'); process.exit(1); }
            console.log('Cache bust:', match[1]);
          "
