name: Scheduled Health Check

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  health-check:
    name: Check Ecosystem Health
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # required to create incident issues on failure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run configured health checks
        id: run-health
        shell: bash
        run: |
          node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('config/health-targets.json','utf8')); for (const t of cfg.targets.filter((target) => target.githubWorkflow)) { console.log([t.name, t.url, t.critical ? 'critical' : 'warning', t.cookie || '', t.checkType || 'page', t.expectedKeyword || ''].join('\t')); }" > /tmp/health-targets.tsv

          failure_count=0
          critical_failure=0
          {
            echo "| Site | Type | HTTP | Content | Outcome |"
            echo "|------|------|------|---------|---------|"
          } > /tmp/health-results.md

          while IFS=$'\t' read -r NAME URL SEVERITY COOKIE CHECK_TYPE KEYWORD; do
            if [[ -z "$NAME" ]]; then
              continue
            fi

            TMPFILE=$(mktemp)
            if [[ -n "$COOKIE" ]]; then
              STATUS=$(curl -s -o "$TMPFILE" -w "%{http_code}" \
                -L --max-redirs 5 \
                --connect-timeout 15 --max-time 30 \
                --cookie "$COOKIE" \
                -A "Mozilla/5.0 (compatible; GFDHealthCheck/1.0)" \
                "$URL") || true
            else
              STATUS=$(curl -s -o "$TMPFILE" -w "%{http_code}" \
                -L --max-redirs 5 \
                --connect-timeout 15 --max-time 30 \
                -A "Mozilla/5.0 (compatible; GFDHealthCheck/1.0)" \
                "$URL") || true
            fi

            STATUS=${STATUS:-000}
            content_ok="—"

            # Content keyword validation (only on successful responses)
            if [[ -n "$KEYWORD" && "$STATUS" =~ ^2 ]]; then
              if grep -qF "$KEYWORD" "$TMPFILE" 2>/dev/null; then
                content_ok="✓"
              else
                content_ok="✗"
              fi
            fi
            rm -f "$TMPFILE"

            if [[ "$STATUS" == "000" || "$STATUS" == 5* ]]; then
              failure_count=$((failure_count + 1))
              if [[ "$SEVERITY" == "critical" ]]; then
                critical_failure=1
                outcome="critical failure"
                echo "::error::$NAME appears DOWN (HTTP $STATUS)"
              else
                outcome="warning"
                echo "::warning::$NAME returned $STATUS"
              fi
            elif [[ "$content_ok" == "✗" ]]; then
              failure_count=$((failure_count + 1))
              outcome="content mismatch"
              echo "::warning::$NAME returned $STATUS but missing expected keyword"
            else
              outcome="ok"
            fi

            echo "$NAME ($CHECK_TYPE) -> HTTP $STATUS, content=$content_ok ($outcome)"
            printf '| %s | %s | %s | %s | %s |\n' "$NAME" "$CHECK_TYPE" "$STATUS" "$content_ok" "$outcome" >> /tmp/health-results.md
          done < /tmp/health-targets.tsv

          cat /tmp/health-results.md >> "$GITHUB_STEP_SUMMARY"
          echo "failure_count=$failure_count" >> "$GITHUB_OUTPUT"
          echo "critical_failure=$critical_failure" >> "$GITHUB_OUTPUT"
          {
            echo "results<<EOF"
            cat /tmp/health-results.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create incident issue on failure
        if: steps.run-health.outputs.critical_failure == '1'
        uses: actions/github-script@v9
        env:
          HEALTH_RESULTS: ${{ steps.run-health.outputs.results }}
        with:
          script: |
            // Check for an existing open incident to avoid duplicates
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'incident',
              state: 'open',
              per_page: 1
            });
            if (existing.length > 0) {
              const issue = existing[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Health check still failing — [run #${context.runNumber}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
              console.log(`Commented on existing incident #${issue.number}`);
              return;
            }

            const now = new Date().toISOString();
            const body = [
              '## Incident Report',
              '',
              `**Time:** ${now}`,
              '**Triggered by:** Scheduled health check workflow',
              '',
              '### Failed Checks',
              '',
              'One or more critical sites failed the automated health check.',
              '',
              process.env.HEALTH_RESULTS,
              '',
              '### Action Required',
              '',
              '1. Run local diagnostics: `.\\scripts\\check-site-health.ps1 -Verbose`',
              '2. Check platform status pages:',
              '   - Cloudflare: https://www.cloudflarestatus.com/',
              '   - Vercel: https://www.vercel-status.com/',
              '3. Review deployment logs in respective dashboards',
              '4. Investigate and restore service',
              '',
              '### Workflow Run',
              '',
              `[View failed run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Site Down Alert - Automated Health Check Failed',
              body: body,
              labels: ['monitoring', 'incident', 'urgent']
            });

      - name: Fail workflow on critical outage
        if: steps.run-health.outputs.critical_failure == '1'
        run: |
          echo "Critical health checks failed"
          exit 1

      - name: Report success
        if: steps.run-health.outputs.failure_count == '0'
        run: |
          echo "✓ All sites operational"
          cat /tmp/health-results.md
