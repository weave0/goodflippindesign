name: Scheduled Health Check

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  health-check:
    name: Check Ecosystem Health
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # required to create incident issues on failure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # curl flags used throughout:
      #   -L             follow redirects (Cloudflare often 301→200)
      #   --max-redirs 5 cap redirect chain
      #   --connect-timeout 15 / --max-time 30  avoid hanging runners
      #   -A "..."       browser UA avoids some Cloudflare bot blocks
      # Failure condition: 000 (connection refused / DNS) or 5xx (server error).
      # 403 from Cloudflare WAF means the edge is running → site is UP.

      - name: Check Good Flippin Design
        id: check-gfd
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -L --max-redirs 5 \
            --connect-timeout 15 --max-time 30 \
            -A "Mozilla/5.0 (compatible; GFDHealthCheck/1.0)" \
            https://goodflippindesign.com)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Good Flippin Design → HTTP $STATUS"
          if [[ "$STATUS" == "000" || "$STATUS" == 5* ]]; then
            echo "::error::Good Flippin Design appears DOWN (HTTP $STATUS)"
            exit 1
          fi

      - name: Check AI Aimate
        id: check-aiaimate
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -L --max-redirs 5 \
            --connect-timeout 15 --max-time 30 \
            -A "Mozilla/5.0 (compatible; GFDHealthCheck/1.0)" \
            https://aiaimate.com)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "AI Aimate → HTTP $STATUS"
          if [[ "$STATUS" == "000" || "$STATUS" == 5* ]]; then
            echo "::error::AI Aimate appears DOWN (HTTP $STATUS)"
            exit 1
          fi

      - name: Check globaldeets Main
        id: check-globaldeets
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -L --max-redirs 5 \
            --connect-timeout 15 --max-time 30 \
            -A "Mozilla/5.0 (compatible; GFDHealthCheck/1.0)" \
            https://globaldeets.com)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "globaldeets → HTTP $STATUS"
          if [[ "$STATUS" == "000" || "$STATUS" == 5* ]]; then
            echo "::warning::globaldeets returned $STATUS"
          fi

      - name: Check Eliassen subdomain
        id: check-eliassen
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -L --max-redirs 5 \
            --connect-timeout 15 --max-time 30 \
            -A "Mozilla/5.0 (compatible; GFDHealthCheck/1.0)" \
            https://eliassen.globaldeets.com)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Eliassen → HTTP $STATUS"
          if [[ "$STATUS" == "000" || "$STATUS" == 5* ]]; then
            echo "::warning::Eliassen subdomain returned $STATUS"
          fi

      - name: Create incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date().toISOString();
            const body = `## Incident Report

            **Time:** ${now}
            **Triggered by:** Scheduled health check workflow

            ### Failed Checks

            One or more critical sites failed the automated health check.

            ### Action Required

            1. Run local diagnostics: \`.\scripts\check-site-health.ps1 -Verbose\`
            2. Check platform status pages:
               - Cloudflare: https://www.cloudflarestatus.com/
               - Vercel: https://www.vercel-status.com/
            3. Review deployment logs in respective dashboards
            4. Investigate and restore service

            ### Workflow Run

            [View failed run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Site Down Alert - Automated Health Check Failed',
              body: body,
              labels: ['monitoring', 'incident', 'urgent']
            });

      - name: Report success
        if: success()
        run: |
          echo "✓ All sites operational"
          echo "- Good Flippin Design: ${{ steps.check-gfd.outputs.status }}"
          echo "- AI Aimate: ${{ steps.check-aiaimate.outputs.status }}"
          echo "- globaldeets: ${{ steps.check-globaldeets.outputs.status }}"
          echo "- Eliassen: ${{ steps.check-eliassen.outputs.status }}"
