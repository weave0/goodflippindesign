name: Force Cloudflare Pages Deployment

on:
    workflow_dispatch: # Manual trigger only

jobs:
    force-deploy:
        name: Force CF Pages Deploy
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Get full history for proper deployment
            
            - name: Get latest commit info
              id: commit
              run: |
                  echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
                  echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
                  echo "message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
            
            - name: Trigger Cloudflare Pages Deployment
              env:
                  CF_API_TOKEN: ${{ secrets.CF_FULL_ITHINK }}
                  CF_ACCOUNT_ID: 3253d907ea85a18eb442283d7308b193
                  CF_PROJECT_NAME: goodflippindesign
              run: |
                  echo "🚀 Forcing Cloudflare Pages deployment..."
                  echo "📍 Commit: ${{ steps.commit.outputs.short_sha }}"
                  echo "📝 Message: ${{ steps.commit.outputs.message }}"
                  echo ""
                  
                  # Get project info to verify access
                  PROJECT_INFO=$(curl -s -X GET \
                    "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME" \
                    -H "Authorization: Bearer $CF_API_TOKEN" \
                    -H "Content-Type: application/json")
                  
                  echo "$PROJECT_INFO" | jq -r '.success'
                  
                  if [ "$(echo $PROJECT_INFO | jq -r '.success')" = "true" ]; then
                    echo "✅ Successfully connected to Cloudflare Pages project"
                    echo "📦 Production branch: $(echo $PROJECT_INFO | jq -r '.result.production_branch')"
                    echo ""
                    
                    # Get latest deployment
                    DEPLOYMENTS=$(curl -s -X GET \
                      "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/deployments?per_page=1" \
                      -H "Authorization: Bearer $CF_API_TOKEN")
                    
                    LATEST_DEPLOY_ID=$(echo $DEPLOYMENTS | jq -r '.result[0].id')
                    echo "🔄 Latest deployment ID: $LATEST_DEPLOY_ID"
                    
                    # Retry deployment
                    RETRY_RESPONSE=$(curl -s -X POST \
                      "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/deployments/$LATEST_DEPLOY_ID/retry" \
                      -H "Authorization: Bearer $CF_API_TOKEN")
                    
                    if [ "$(echo $RETRY_RESPONSE | jq -r '.success')" = "true" ]; then
                      echo "✅ Deployment retry triggered successfully!"
                      echo ""
                      echo "🌐 Monitor at: https://dash.cloudflare.com/$CF_ACCOUNT_ID/pages/view/$CF_PROJECT_NAME"
                    else
                      echo "⚠️ Retry endpoint returned:"
                      echo "$RETRY_RESPONSE" | jq '.'
                      echo ""
                      echo "💡 Deployment may still trigger via GitHub webhook"
                    fi
                  else
                    echo "❌ Failed to connect to Cloudflare Pages"
                    echo "$PROJECT_INFO" | jq '.errors'
                    exit 1
                  fi
            
            - name: Wait for deployment
              run: |
                  echo "⏳ Waiting 90 seconds for deployment to complete..."
                  sleep 90
            
            - name: Verify deployment
              run: |
                  echo "🧪 Checking deployed site..."
                  CACHE_BUST=$(curl -s https://goodflippindesign.pages.dev/ | grep -oP '<!-- Cache bust: \K[0-9-:]+')
                  echo "📅 Current cache bust: $CACHE_BUST"
                  
                  EXPECTED_BUST=$(grep -oP '<!-- Cache bust: \K[0-9-:]+' index.html)
                  echo "📅 Expected cache bust: $EXPECTED_BUST"
                  
                  if [ "$CACHE_BUST" = "$EXPECTED_BUST" ]; then
                    echo "✅ Deployment verified! Site is fresh!"
                  else
                    echo "⚠️ Site may still be deploying or cache is stale"
                    echo "🔄 Wait a few more minutes and check: https://goodflippindesign.pages.dev/"
                  fi
