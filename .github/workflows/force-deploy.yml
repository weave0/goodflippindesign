name: Force Cloudflare Pages Deployment

on:
  workflow_dispatch: # Manual trigger only

jobs:
  force-deploy:
    name: Force CF Pages Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get full history for proper deployment

      - name: Get latest commit info
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      - name: Trigger Cloudflare Pages Deployment
        id: cf
        env:
          CF_API_TOKEN: ${{ secrets.CF_FULL_ITHINK }}
          CF_ACCOUNT_ID: 3253d907ea85a18eb442283d7308b193
          CF_PROJECT_NAME: goodflippindesign
        run: |
          echo "🚀 Forcing Cloudflare Pages deployment..."
          echo "📍 Commit: ${{ steps.commit.outputs.short_sha }}"
          echo "📝 Message: ${{ steps.commit.outputs.message }}"
          echo ""

          # Get project info to verify access
          PROJECT_INFO=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json")

          echo "$PROJECT_INFO" | jq -r '.success'

          if [ "$(echo $PROJECT_INFO | jq -r '.success')" = "true" ]; then
            echo "✅ Successfully connected to Cloudflare Pages project"
            echo "📦 Production branch: $(echo $PROJECT_INFO | jq -r '.result.production_branch')"
            echo ""

            # Purge build cache (helps when Pages serves stale artifacts)
            echo "🧹 Purging Pages build cache..."
            PURGE_RESPONSE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/purge_build_cache" \
              -H "Authorization: Bearer $CF_API_TOKEN")
            echo "$PURGE_RESPONSE" | jq -r '.success' || true

            # Create a NEW deployment from production
            echo "🆕 Creating a new Pages deployment from production..."
            CREATE_RESPONSE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/deployments" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{
                "branch": "main",
                "commit_hash": "${{ steps.commit.outputs.sha }}",
                "commit_message": "${{ steps.commit.outputs.message }}",
                "commit_dirty": "false"
              }')

            if [ "$(echo $CREATE_RESPONSE | jq -r '.success')" = "true" ]; then
              NEW_DEPLOY_ID=$(echo $CREATE_RESPONSE | jq -r '.result.id')
              echo "✅ Deployment created successfully!"
              echo "🔄 New deployment ID: $NEW_DEPLOY_ID"
              echo "🌐 Monitor at: https://dash.cloudflare.com/$CF_ACCOUNT_ID/pages/view/$CF_PROJECT_NAME"
              echo "deploy_id=$NEW_DEPLOY_ID" >> "$GITHUB_OUTPUT"
            else
              echo "❌ Create deployment failed:"
              echo "$CREATE_RESPONSE" | jq '.'
              exit 1
            fi
          else
            echo "❌ Failed to connect to Cloudflare Pages"
            echo "$PROJECT_INFO" | jq '.errors'
            exit 1
          fi

      - name: Wait for Cloudflare deployment to finish
        env:
          CF_API_TOKEN: ${{ secrets.CF_FULL_ITHINK }}
          CF_ACCOUNT_ID: 3253d907ea85a18eb442283d7308b193
          CF_PROJECT_NAME: goodflippindesign
        run: |
          echo "⏳ Waiting for Cloudflare deployment status (id: ${{ steps.cf.outputs.deploy_id }})"
          echo "📍 Expected commit: ${{ steps.commit.outputs.sha }}"

          MAX_ATTEMPTS=60
          SLEEP_SECONDS=15

          for i in $(seq 1 $MAX_ATTEMPTS); do
            DEPLOY_INFO=$(curl -s -X GET \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/deployments/${{ steps.cf.outputs.deploy_id }}" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json")

            SUCCESS=$(echo "$DEPLOY_INFO" | jq -r '.success')
            if [ "$SUCCESS" != "true" ]; then
              echo "❌ Failed to fetch deployment info"
              echo "$DEPLOY_INFO" | jq '.errors'
              exit 1
            fi

            STATUS=$(echo "$DEPLOY_INFO" | jq -r '.result.latest_stage.status // empty')
            STAGE=$(echo "$DEPLOY_INFO" | jq -r '.result.latest_stage.name // empty')
            COMMIT=$(echo "$DEPLOY_INFO" | jq -r '.result.deployment_trigger.metadata.commit_hash // .result.deployment_trigger.metadata.commitHash // .result.commit_hash // empty')
            ALIASES=$(echo "$DEPLOY_INFO" | jq -r '.result.aliases[]?')

            echo "[$i/$MAX_ATTEMPTS] stage=$STAGE status=$STATUS commit=${COMMIT:-unknown}"
            if [ -n "$ALIASES" ]; then
              echo "$ALIASES" | sed 's/^/  - alias: /'
            fi

            if [ "$STATUS" = "failure" ]; then
              echo "❌ Cloudflare deployment failed."
              exit 1
            fi

            if [ "$STATUS" = "success" ]; then
              if [ -n "$COMMIT" ] && [ "$COMMIT" != "${{ steps.commit.outputs.sha }}" ]; then
                echo "❌ Cloudflare deployed a different commit than expected."
                echo "Expected: ${{ steps.commit.outputs.sha }}"
                echo "Actual:   $COMMIT"
                exit 1
              fi
              echo "✅ Cloudflare deployment finished successfully."
              exit 0
            fi

            echo "⏳ Still building... sleeping ${SLEEP_SECONDS}s"
            sleep $SLEEP_SECONDS
          done

          echo "❌ Timed out waiting for Cloudflare deployment to finish."
          exit 1

      - name: Verify deployment
        run: |
          echo "🧪 Checking deployed site..."

          # Poll because Pages edge propagation can take a few minutes even after build success.
          MAX_ATTEMPTS=30
          SLEEP_SECONDS=20
          COMMIT="${{ steps.commit.outputs.sha }}"

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo ""
            echo "🔁 Attempt $i/$MAX_ATTEMPTS..."

            # Fetch both pages (follow redirects, bypass CDN cache)
            INDEX_HTML=$(curl -sS -L -w '\n__STATUS__%{http_code}' --compressed \
              -H 'Cache-Control: no-store' -H 'Pragma: no-cache' \
              "https://goodflippindesign.pages.dev/?bust=$i")
            PORTAL_HTML=$(curl -sS -L -w '\n__STATUS__%{http_code}' --compressed \
              -H 'Cache-Control: no-store' -H 'Pragma: no-cache' \
              "https://goodflippindesign.pages.dev/community-portal.html?bust=$i")

            # Extract HTTP status codes
            INDEX_STATUS=$(echo "$INDEX_HTML" | grep '__STATUS__' | sed 's/__STATUS__//')
            PORTAL_STATUS=$(echo "$PORTAL_HTML" | grep '__STATUS__' | sed 's/__STATUS__//')

            # Check structural markers (stable across content changes)
            HAS_COMMUNITY_LINK=0
            HAS_HERO_CTA=0
            HAS_INDEX_TITLE=0
            grep -q 'community-portal.html' <<<"$INDEX_HTML"  && HAS_COMMUNITY_LINK=1 || true
            grep -q 'hero-primary-btn'      <<<"$PORTAL_HTML" && HAS_HERO_CTA=1       || true
            grep -q '<title>'               <<<"$INDEX_HTML"  && HAS_INDEX_TITLE=1    || true

            echo "- index.html:            HTTP $INDEX_STATUS | title: $([ $HAS_INDEX_TITLE -eq 1 ] && echo '✅' || echo '❌') | community link: $([ $HAS_COMMUNITY_LINK -eq 1 ] && echo '✅' || echo '❌')"
            echo "- community-portal.html: HTTP $PORTAL_STATUS | hero CTA btn: $([ $HAS_HERO_CTA -eq 1 ] && echo '✅' || echo '❌')"

            if [ "$INDEX_STATUS" = "200" ] && [ "$PORTAL_STATUS" = "200" ] && \
               [ $HAS_INDEX_TITLE -eq 1 ] && [ $HAS_COMMUNITY_LINK -eq 1 ] && [ $HAS_HERO_CTA -eq 1 ]; then
              echo ""
              echo "✅ Deployment verified — HTTP 200, structural markers confirmed."
              exit 0
            fi

            echo "⏳ Not ready yet. Sleeping ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
          done

          echo ""
          echo "❌ Deployment verification failed after $((MAX_ATTEMPTS * SLEEP_SECONDS)) seconds."
          echo "   Expected: index HTTP 200 + community-portal.html nav link + hero-primary-btn"
          exit 1

      - name: Dump Cloudflare deployment logs (on failure)
        if: failure()
        env:
          CF_API_TOKEN: ${{ secrets.CF_FULL_ITHINK }}
          CF_ACCOUNT_ID: 3253d907ea85a18eb442283d7308b193
          CF_PROJECT_NAME: goodflippindesign
        run: |
          echo "📄 Fetching Cloudflare deployment logs for id: ${{ steps.cf.outputs.deploy_id }}"

          LOGS=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/deployments/${{ steps.cf.outputs.deploy_id }}/history/logs" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json")

          if [ "$(echo "$LOGS" | jq -r '.success')" != "true" ]; then
            echo "❌ Failed to fetch deployment logs"
            echo "$LOGS" | jq '.errors'
            exit 0
          fi

          echo "includes_container_logs: $(echo "$LOGS" | jq -r '.result.includes_container_logs')"
          echo "total: $(echo "$LOGS" | jq -r '.result.total')"
          echo ""

          # Best-effort formatting; schema may vary.
          echo "$LOGS" | jq -r '.result.data[]? | (.message? // .msg? // .log? // tostring)' | tail -n 400
