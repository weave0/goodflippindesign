name: Lighthouse CI

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run weekly on Mondays at 9am UTC
    - cron: "0 9 * * 1"

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --ignore-scripts && npx puppeteer browsers install chrome
        # npm ci fails cross-platform: Windows lockfile omits Linux-only @emnapi deps

      - name: Build site
        run: npm run build

      - name: Start local server
        run: |
          npx http-server . -p 8080 &
          sleep 5

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:8080/
          budgetPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment PR with Lighthouse scores
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const results = JSON.parse(fs.readFileSync('.lighthouseci/manifest.json', 'utf8'));
              const summary = results[0].summary;

              const body = `## 🚦 Lighthouse Audit Results

              | Category | Score |
              |----------|-------|
              | 🎭 Performance | ${summary.performance}% |
              | ♿ Accessibility | ${summary.accessibility}% |
              | 🔍 Best Practices | ${summary['best-practices']}% |
              | 📊 SEO | ${summary.seo}% |
              | ⚡ PWA | ${summary.pwa}% |

              [View Full Report](${results[0].url})`;

              try {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body
                });
              } catch (e) {
                console.log('Could not comment on PR:', e.message);
              }
            } catch (e) {
              console.log('Could not read Lighthouse results:', e.message);
            }
