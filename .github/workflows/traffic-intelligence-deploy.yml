name: Traffic Intelligence - Deploy

on:
  push:
    branches: [main]
    paths:
      - "traffic-intelligence/**"
      - ".github/workflows/traffic-intelligence-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traffic-intelligence-production
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: 3253d907ea85a18eb442283d7308b193
  CF_PROJECT_NAME: gfd-traffic-intelligence
  CF_CUSTOM_DOMAIN: traffic.goodflippindesign.com
  WRANGLER_VERSION: 4.129.0

jobs:
  deploy:
    name: Build, deploy, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FULL_ITHINK }}
      CLOUDFLARE_ACCOUNT_ID: 3253d907ea85a18eb442283d7308b193

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: traffic-intelligence/package-lock.json

      - name: Install Traffic Intelligence
        run: npm ci --prefix traffic-intelligence --no-audit

      - name: Validate Traffic Intelligence
        run: |
          npm --prefix traffic-intelligence run lint
          npm --prefix traffic-intelligence test
          npm --prefix traffic-intelligence run build
          test -f traffic-intelligence/dist/index.html
          test -f traffic-intelligence/dist/gold/canonical-gold-m1.2.json
          test -f traffic-intelligence/dist/_headers
          test -f traffic-intelligence/dist/robots.txt

      - name: Verify Cloudflare credential is available
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "CF_FULL_ITHINK is not available to this workflow"
            exit 1
          }

      - name: Ensure isolated Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          project_url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME"
          response="$(curl -sS "$project_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

          if [ "$(jq -r '.success' <<<"$response")" = "true" ]; then
            echo "Pages project already exists: $CF_PROJECT_NAME"
            exit 0
          fi

          echo "Creating isolated Direct Upload Pages project: $CF_PROJECT_NAME"
          create_response="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"$CF_PROJECT_NAME\",\"production_branch\":\"main\"}")"

          jq '.' <<<"$create_response"
          test "$(jq -r '.success' <<<"$create_response")" = "true"

      - name: Deploy exact production artifact
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy traffic-intelligence/dist \
            --project-name="$CF_PROJECT_NAME" \
            --branch=main

      - name: Ensure custom domain is attached
        shell: bash
        run: |
          set -euo pipefail
          domain_url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/domains/$CF_CUSTOM_DOMAIN"
          response="$(curl -sS "$domain_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

          if [ "$(jq -r '.success' <<<"$response")" = "true" ]; then
            echo "Custom domain already attached: $CF_CUSTOM_DOMAIN"
            exit 0
          fi

          attach_response="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"$CF_CUSTOM_DOMAIN\"}")"

          jq '.' <<<"$attach_response"
          test "$(jq -r '.success' <<<"$attach_response")" = "true"

      - name: Verify Pages production URL
        shell: bash
        run: |
          set -euo pipefail
          pages_url="https://$CF_PROJECT_NAME.pages.dev"
          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors "$pages_url/" -o /tmp/traffic-index.html
          grep -q "GFD Traffic Intelligence" /tmp/traffic-index.html
          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors \
            "$pages_url/gold/canonical-gold-m1.2.json" \
            | jq -e '.schema_version == "1.2.0" and .contract_name == "gfd-canonical-gold" and .fixture == true' >/dev/null
          echo "Verified: $pages_url"

      - name: Verify custom domain
        shell: bash
        run: |
          set -euo pipefail
          domain_url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/domains/$CF_CUSTOM_DOMAIN"
          status="unknown"
          response='{}'

          for attempt in $(seq 1 24); do
            response="$(curl -sS "$domain_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
            status="$(jq -r '.result.status // "unknown"' <<<"$response")"
            echo "Custom-domain status attempt $attempt: $status"
            if [ "$status" = "active" ]; then
              break
            fi
            sleep 5
          done

          if [ "$status" != "active" ]; then
            echo "Custom domain did not become active: $CF_CUSTOM_DOMAIN"
            jq '.' <<<"$response"
            exit 1
          fi

          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors \
            "https://$CF_CUSTOM_DOMAIN/" -o /tmp/traffic-custom-index.html
          grep -q "GFD Traffic Intelligence" /tmp/traffic-custom-index.html
          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors \
            "https://$CF_CUSTOM_DOMAIN/gold/canonical-gold-m1.2.json" \
            | jq -e '.schema_version == "1.2.0" and .contract_name == "gfd-canonical-gold" and .fixture == true' >/dev/null
          echo "Production observatory verified: https://$CF_CUSTOM_DOMAIN"
