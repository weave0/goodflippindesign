name: Traffic Intelligence - Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - "traffic-intelligence/**"
      - "scripts/cf-pages-projects.sh"
      - "scripts/cf-pages-projects.test.mjs"
      - ".github/workflows/traffic-intelligence-deploy.yml"
  push:
    branches: [main]
    paths:
      - "traffic-intelligence/**"
      - "scripts/cf-pages-projects.sh"
      - "scripts/cf-pages-projects.test.mjs"
      - ".github/workflows/traffic-intelligence-deploy.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: traffic-intelligence-production-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: 3253d907ea85a18eb442283d7308b193
  CF_PROJECT_NAME: gfd-traffic-intelligence
  CF_CUSTOM_DOMAIN: traffic.goodflippindesign.com
  WRANGLER_VERSION: 4.129.0
  CF_EXPECTED_ZONES: agentkagent.com,aiaimate.com,artificelligance.com,artificelligence.com,brettleeweaver.com,citizenapproved.org,culturesherpa.com,culturesherpa.org,cyancanoe.com,flipskillet.com,flipskillit.com,foxyana.com,fwomps.com,fwomp.us,gflippinv.com,globaldeets.com,goodflippindesign.com,goodflippinluck.com,goodflippinnews.com,goodflippinvibes.com,goodflippinyikes.com,heavymoose.com,lowertownstpaul.org,minnesotapeace.com,redleopardofstpaul.com

jobs:
  pr-validation:
    name: PR fixture validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: traffic-intelligence/package-lock.json

      - name: Install Traffic Intelligence
        run: npm ci --prefix traffic-intelligence --no-audit

      - name: Validate Cloudflare Pages project pagination (TI-012)
        run: node --test scripts/cf-pages-projects.test.mjs

      - name: Validate committed fixture
        run: |
          npm --prefix traffic-intelligence run lint
          npm --prefix traffic-intelligence test
          npm --prefix traffic-intelligence run build
          test -f traffic-intelligence/dist/index.html
          test -f traffic-intelligence/dist/gold/canonical-gold-m1.2.json
          test -f traffic-intelligence/dist/gold/traffic-insights-1.0.json
          test -f traffic-intelligence/dist/gold/ti-work-queue-1.0.json
          test -f traffic-intelligence/dist/_worker.js
          test -f traffic-intelligence/dist/_headers
          test -f traffic-intelligence/dist/robots.txt
          node - <<'NODE'
          const fs = require("node:fs");
          const gold = JSON.parse(fs.readFileSync("traffic-intelligence/dist/gold/canonical-gold-m1.2.json", "utf8"));
          if (gold.fixture !== true) throw new Error("PR validation must use the committed fixture");
          if (!Array.isArray(gold.metrics) || gold.metrics.length === 0) throw new Error("fixture metrics are empty");
          const insights = JSON.parse(fs.readFileSync("traffic-intelligence/dist/gold/traffic-insights-1.0.json", "utf8"));
          if (insights.fixture !== true) throw new Error("PR validation must use the committed insight fixture");
          if (insights.contract_name !== "gfd-traffic-insights") throw new Error("insight fixture contract mismatch");
          if (insights.schema_version !== "1.1.0" && insights.schema_version !== "1.0.0") {
            throw new Error(`insight fixture schema_version unsupported: ${insights.schema_version}`);
          }
          if (insights.schema_version === "1.1.0") {
            if (!Array.isArray(insights.briefs)) throw new Error("insight fixture 1.1 requires briefs");
            if (!insights.estate_brief || typeof insights.estate_brief !== "object") {
              throw new Error("insight fixture 1.1 requires estate_brief");
            }
            if (!Array.isArray(insights.property_health)) throw new Error("insight fixture 1.1 requires property_health");
            if (!Array.isArray(insights.trend_comparisons)) {
              throw new Error("insight fixture 1.1 requires trend_comparisons");
            }
          }
          const workQueue = JSON.parse(fs.readFileSync("traffic-intelligence/dist/gold/ti-work-queue-1.0.json", "utf8"));
          if (workQueue.contract_name !== "gfd-ti-work-queue") throw new Error("work queue contract mismatch");
          if (workQueue.schema_version !== "1.1.0" && workQueue.schema_version !== "1.0.0") throw new Error(`work queue schema_version mismatch: ${workQueue.schema_version}`);
          if (workQueue.schema_version === "1.1.0" && (!workQueue.metrics || typeof workQueue.metrics !== "object")) throw new Error("work queue 1.1 requires metrics");
          if (workQueue.fixture !== true) throw new Error("PR validation must use the committed work-queue fixture");
          console.log("fixture_validation=true");
          NODE

      - name: Assert deployment is skipped for pull requests
        run: |
          grep -q "if: github.event_name != 'pull_request'" .github/workflows/traffic-intelligence-deploy.yml
          echo "live_deployment_skipped=true"

  deploy:
    name: Build, deploy, and verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 3253d907ea85a18eb442283d7308b193
      PRODUCER_REPOSITORY: weave0/gfd-traffic-intelligence

    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7

      - name: Verify trusted event
        shell: bash
        run: |
          case "$GITHUB_EVENT_NAME" in
            push|schedule|workflow_dispatch) ;;
            *) echo "Unsupported live deployment event: $GITHUB_EVENT_NAME"; exit 1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Live deployment requires the main branch"
            exit 1
          fi

      - name: Verify governed credentials are available and distinct
        shell: bash
        env:
          PRODUCER_READ_TOKEN: ${{ secrets.GFD_TI_READ_TOKEN }}
          ANALYTICS_TOKEN: ${{ secrets.CF_GFD_TI_ANALYTICS_TOKEN }}
          DEPLOY_TOKEN: ${{ secrets.CF_GFD_TI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRODUCER_READ_TOKEN" || { echo "GFD_TI_READ_TOKEN is not available"; exit 1; }
          test -n "$ANALYTICS_TOKEN" || { echo "CF_GFD_TI_ANALYTICS_TOKEN is not available"; exit 1; }
          test -n "$DEPLOY_TOKEN" || { echo "CF_GFD_TI_DEPLOY_TOKEN is not available"; exit 1; }
          test "$ANALYTICS_TOKEN" != "$DEPLOY_TOKEN" || {
            echo "Cloudflare analytics and deploy credentials must be distinct tokens"
            exit 1
          }

      - name: Verify Cloudflare API tokens
        shell: bash
        env:
          ANALYTICS_TOKEN: ${{ secrets.CF_GFD_TI_ANALYTICS_TOKEN }}
          DEPLOY_TOKEN: ${{ secrets.CF_GFD_TI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for token_name in ANALYTICS_TOKEN DEPLOY_TOKEN; do
            token="${!token_name}"
            response="$(curl -fsS https://api.cloudflare.com/client/v4/user/tokens/verify \
              -H "Authorization: Bearer $token")"
            test "$(jq -r '.success' <<<"$response")" = "true"
            test "$(jq -r '.result.status' <<<"$response")" = "active"
            echo "${token_name,,}=active"
          done

      - name: Verify complete Cloudflare analytics estate access
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_GFD_TI_ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          all_zones='[]'
          page=1
          total_pages=1
          while [ "$page" -le "$total_pages" ]; do
            zones_response="$(curl -fsS -G "https://api.cloudflare.com/client/v4/zones" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --data-urlencode "account.id=$CF_ACCOUNT_ID" \
              --data-urlencode "per_page=50" \
              --data-urlencode "page=$page")"
            test "$(jq -r '.success' <<<"$zones_response")" = "true"
            all_zones="$(jq -c --argjson accumulated "$all_zones" '$accumulated + .result' <<<"$zones_response")"
            total_pages="$(jq -r '.result_info.total_pages // 1' <<<"$zones_response")"
            page=$((page + 1))
          done

          visible_names="$(jq -r '.[].name' <<<"$all_zones" | sort)"
          expected_names="$(tr ',' '\n' <<<"$CF_EXPECTED_ZONES" | sed '/^$/d' | sort)"
          if ! diff -u <(printf '%s\n' "$expected_names") <(printf '%s\n' "$visible_names"); then
            echo "CF_GFD_TI_ANALYTICS_TOKEN does not expose the exact governed GFD zone inventory"
            echo "Expected inventory changes must be reviewed in CF_EXPECTED_ZONES before production acquisition"
            exit 1
          fi

          zone_count="$(jq -r 'length' <<<"$all_zones")"
          start="$(date -u -d '2 days ago' +%F)"
          end="$(date -u -d '1 day ago' +%F)"
          while IFS=$'\t' read -r zone_id zone_name; do
            graphql_payload="$(jq -n --arg zone "$zone_id" --arg start "$start" --arg end "$end" '{
              query: "query($zone: String!, $start: Date!, $end: Date!) { viewer { zones(filter: {zoneTag: $zone}) { httpRequests1dGroups(limit: 1, filter: {date_geq: $start, date_leq: $end}) { dimensions { date } } } } }",
              variables: {zone: $zone, start: $start, end: $end}
            }')"
            analytics_response="$(curl -fsS https://api.cloudflare.com/client/v4/graphql \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$graphql_payload")"
            if [ "$(jq '.errors // [] | length' <<<"$analytics_response")" -ne 0 ]; then
              echo "CF_GFD_TI_ANALYTICS_TOKEN cannot query Cloudflare GraphQL Analytics for $zone_name"
              jq -r '.errors[]?.message' <<<"$analytics_response"
              exit 1
            fi
          done < <(jq -r '.[] | [.id, .name] | @tsv' <<<"$all_zones")
          echo "analytics_visible_zones=$zone_count"
          echo "cloudflare_analytics_estate_access=verified"

      - name: Checkout private Gold producer
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PRODUCER_REPOSITORY }}
          # TI-011 candidate: bounded path/status acquisition + governed HTTP failure findings.
          # Accepted producer PR #6 merge commit; immutable production authority.
          ref: 41f01db8d8b6fac0d29461ce17e609092663e4e5
          token: ${{ secrets.GFD_TI_READ_TOKEN }}
          path: .producer
          persist-credentials: false

      - name: Record producer identity
        shell: bash
        run: |
          producer_sha="$(git -C .producer rev-parse HEAD)"
          test -n "$producer_sha"
          echo "PRODUCER_SHA=$producer_sha" >> "$GITHUB_ENV"
          echo "Producer: $PRODUCER_REPOSITORY@$producer_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: .producer/requirements-lock.txt

      - name: Install certified producer
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          source = Path(".producer/requirements-lock.txt")
          target = Path(os.environ["RUNNER_TEMP"]) / "gfdti-requirements.txt"
          target.write_text("".join(line for line in source.read_text(encoding="utf-8").splitlines(True) if not line.startswith("pytest==")), encoding="utf-8")
          print(f"install_requirements={target}")
          PY
          python -m pip install -r "$RUNNER_TEMP/gfdti-requirements.txt"
          python -m pip install --no-deps ./.producer
          python -m pip install "pytest<9"

      - name: Validate producer Canonical Gold contract
        run: python -m pytest -q .producer/tests/test_canonical_gold_1_2.py .producer/tests/test_contracts.py

      - name: Acquire current Cloudflare Gold
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_GFD_TI_ANALYTICS_TOKEN }}
        run: python -m gfdti.cli --acquire-cloudflare-gold --output-dir "$RUNNER_TEMP/gfdti-live"

      - name: Acquire bounded Cloudflare estate configuration evidence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_GFD_TI_DEPLOY_TOKEN }}
          CF_ZONE_API_TOKEN: ${{ secrets.CF_GFD_TI_ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gfdti-live/estate-config-1.0.production.json"
          # Pages project authority belongs to the deploy credential; zone/DNS
          # observation belongs to the analytics credential, which is the one
          # already verified (see "Verify complete Cloudflare analytics estate
          # access") to expose the full governed zone inventory. The deploy
          # credential is scoped narrowly to its own Pages project's zone, so
          # using it for the zone list here silently under-reports the estate.
          projects="$(scripts/cf-pages-projects.sh)"
          test "$(jq -r '.success' <<<"$projects")" = "true"
          zones="$(curl -fsS "https://api.cloudflare.com/client/v4/zones?per_page=50" -H "Authorization: Bearer $CF_ZONE_API_TOKEN")"
          test "$(jq -r '.success' <<<"$zones")" = "true"
          tmp="$(mktemp)"
          printf '{"schema_version":"1.0.0","contract_name":"gfd-estate-config","fixture":false,"properties":[' > "$tmp"
          first=1
          IFS=',' read -ra expected_zones <<< "$CF_EXPECTED_ZONES"
          for zone_name in "${expected_zones[@]}"; do
            zone="$(jq -c --arg n "$zone_name" '.result[] | select(.name==$n)' <<<"$zones" | head -1)"
            if [ -z "$zone" ]; then
              echo "Governed zone missing from Cloudflare zone-list evidence: $zone_name"
              exit 1
            fi
            zone_id="$(jq -r '.id' <<<"$zone")"
            dns="$(curl -fsS "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?per_page=100" -H "Authorization: Bearer $CF_ZONE_API_TOKEN")"
            test "$(jq -r '.success' <<<"$dns")" = "true"
            project="$(jq -c --arg d "$zone_name" '.result[] | select((.domains // []) | index($d))' <<<"$projects" | head -1)"
            record="$(jq -n --arg property "$zone_name" --argjson z "$zone" --argjson dns "$dns" --argjson p "${project:-null}" '
              {
                property_id:$property,
                zone_status:$z.status,
                dns_apex:[$dns.result[] | select(.name==$property) | {name,type,content,proxied}],
                dns_www:[$dns.result[] | select(.name==("www."+$property)) | {name,type,content,proxied}],
                pages:(if $p == null then {} else {
                  project_name:$p.name,
                  source_type:($p.source.type // null),
                  source_repository:(if ($p.source.type // null) == "github" then (($p.source.config.owner // "") + "/" + ($p.source.config.repo_name // "")) else null end),
                  latest_production_deployment:($p.latest_deployment.created_on // null)
                } end)
              }')"
            if [ "$first" -eq 0 ]; then printf ',' >> "$tmp"; fi
            printf '%s' "$record" >> "$tmp"
            first=0
          done
          printf ']}' >> "$tmp"
          jq '.' "$tmp" > "$out"
          rm -f "$tmp"
          test "$(jq -r '.fixture' "$out")" = "false"
          property_count="$(jq '.properties | length' "$out")"
          test "$property_count" -eq "${#expected_zones[@]}" || {
            echo "estate artifact has $property_count properties but ${#expected_zones[@]} zones are governed"
            exit 1
          }
          if grep -Fq "$CLOUDFLARE_API_TOKEN" "$out"; then echo "credential serialized"; exit 1; fi
          if grep -Fq "$CF_ZONE_API_TOKEN" "$out"; then echo "credential serialized"; exit 1; fi
          echo "estate_config_properties=$property_count"

      - name: Rebuild insights with bounded estate configuration evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_GFD_TI_ANALYTICS_TOKEN }}
        run: python -m gfdti.cli --build-cloudflare-insights --output-dir "$RUNNER_TEMP/gfdti-live"

      - name: Validate live producer artifact
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from gfdti.contracts import CanonicalGold12

          artifact_path = Path(__import__('os').environ["RUNNER_TEMP"]) / "gfdti-live" / "canonical-gold-1.2.production.json"
          artifact = json.loads(artifact_path.read_text(encoding="utf-8"))
          CanonicalGold12.model_validate(artifact)
          if artifact.get("fixture") is not False:
              raise SystemExit("production artifact must declare fixture=false")
          if artifact.get("schema_version") != "1.2.0":
              raise SystemExit(f"unsupported schema_version={artifact.get('schema_version')!r}")
          if not artifact.get("metrics"):
              raise SystemExit("production artifact contains no metrics")
          generated_at = datetime.fromisoformat(artifact["generated_at"].replace("Z", "+00:00"))
          now = datetime.now(timezone.utc)
          if generated_at > now + timedelta(minutes=15):
              raise SystemExit("production artifact generated_at is implausibly in the future")
          if generated_at < now - timedelta(hours=36):
              raise SystemExit("production artifact is stale (>36h)")
          print("live_gold_valid=true")
          print(f"generated_at={artifact['generated_at']}")
          print(f"metrics={len(artifact['metrics'])}")
          PY

      - name: Validate live insight sidecar
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from gfdti.insights import TrafficInsightDocument

          root = Path(__import__('os').environ["RUNNER_TEMP"]) / "gfdti-live"
          gold_path = root / "canonical-gold-1.2.production.json"
          preferred = root / "traffic-insights-1.1.production.json"
          legacy = root / "traffic-insights-1.0.production.json"
          if preferred.is_file():
              insight_path = preferred
          elif legacy.is_file():
              raise SystemExit(
                  "Found traffic-insights-1.0.production.json only. "
                  "Consumer TI-007 requires producer schema 1.1 "
                  "(traffic-insights-1.1.production.json with briefs + estate_brief). "
                  "Merge weave0/gfd-traffic-intelligence#5 or keep the pinned producer SHA."
              )
          else:
              raise SystemExit(f"missing insight sidecar: expected {preferred.name}")
          gold = json.loads(gold_path.read_text(encoding="utf-8"))
          artifact = json.loads(insight_path.read_text(encoding="utf-8"))
          doc = TrafficInsightDocument.model_validate(artifact)
          if doc.fixture is not False:
              raise SystemExit("production insight sidecar must declare fixture=false")
          if doc.schema_version != "1.1.0":
              raise SystemExit(f"unsupported insight schema_version={doc.schema_version!r} (require 1.1.0)")
          if doc.contract_name != "gfd-traffic-insights":
              raise SystemExit(f"unexpected insight contract_name={doc.contract_name!r}")
          if not doc.series:
              raise SystemExit("production insight sidecar contains no series")
          if not doc.briefs:
              raise SystemExit("production insight sidecar 1.1 requires non-empty briefs")
          if doc.estate_brief is None:
              raise SystemExit("production insight sidecar 1.1 requires estate_brief")
          if not doc.property_health:
              raise SystemExit("production insight sidecar 1.1 requires property_health")
          if not isinstance(doc.trend_comparisons, list):
              raise SystemExit("production insight sidecar 1.1 requires trend_comparisons list")
          gold_ts = datetime.fromisoformat(gold["generated_at"].replace("Z", "+00:00"))
          if doc.source_gold_generated_at != gold_ts:
              raise SystemExit("insight sidecar source_gold_generated_at does not match live Gold")
          generated_at = doc.generated_at if doc.generated_at.tzinfo else doc.generated_at.replace(tzinfo=timezone.utc)
          now = datetime.now(timezone.utc)
          if generated_at > now + timedelta(minutes=15):
              raise SystemExit("insight sidecar generated_at is implausibly in the future")
          if generated_at < now - timedelta(hours=36):
              raise SystemExit("insight sidecar is stale (>36h)")
          print("live_insights_valid=true")
          print(f"insight_path={insight_path.name}")
          print(f"generated_at={doc.generated_at.isoformat()}")
          print(f"series={len(doc.series)}")
          print(f"findings={len(doc.findings)}")
          print(f"actions={len(doc.actions)}")
          print(f"briefs={len(doc.briefs)}")
          print(f"estate_status={doc.estate_brief.status}")
          PY

      - name: Assert governed secrets are absent from live Gold
        shell: bash
        env:
          PRODUCER_READ_TOKEN: ${{ secrets.GFD_TI_READ_TOKEN }}
          ANALYTICS_TOKEN: ${{ secrets.CF_GFD_TI_ANALYTICS_TOKEN }}
          DEPLOY_TOKEN: ${{ secrets.CF_GFD_TI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for artifact in \
            "$RUNNER_TEMP/gfdti-live/canonical-gold-1.2.production.json" \
            "$RUNNER_TEMP/gfdti-live/traffic-insights-1.1.production.json"
          do
            for secret_name in PRODUCER_READ_TOKEN ANALYTICS_TOKEN DEPLOY_TOKEN; do
              secret="${!secret_name}"
              if grep -Fq -- "$secret" "$artifact"; then
                echo "secret $secret_name was serialized into $artifact"
                exit 1
              fi
            done
          done
          echo "governed_secret_exclusion=verified"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: traffic-intelligence/package-lock.json

      - name: Install Traffic Intelligence
        run: npm ci --prefix traffic-intelligence --no-audit

      - name: Validate consumer against committed fixture
        run: |
          npm --prefix traffic-intelligence run lint
          npm --prefix traffic-intelligence test

      - name: Sync GitHub work queue from validated live insights
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TI_WORK_REPO: weave0/goodflippindesign
        run: |
          set -euo pipefail
          npm --prefix traffic-intelligence run sync:work -- \
            --insights "$RUNNER_TEMP/gfdti-live/traffic-insights-1.1.production.json" \
            --out "$RUNNER_TEMP/gfdti-live/ti-work-queue-1.0.json"
          echo "ti_work_sync=true"

      - name: Inject validated live Gold, insights, and work queue into ephemeral build
        shell: bash
        run: |
          install -m 600 "$RUNNER_TEMP/gfdti-live/canonical-gold-1.2.production.json" traffic-intelligence/public/gold/canonical-gold-m1.2.json
          # Keep consumer URL stable (admin wall + load path) while shipping schema 1.1 contents.
          install -m 600 "$RUNNER_TEMP/gfdti-live/traffic-insights-1.1.production.json" traffic-intelligence/public/gold/traffic-insights-1.0.json
          install -m 600 "$RUNNER_TEMP/gfdti-live/ti-work-queue-1.0.json" traffic-intelligence/public/gold/ti-work-queue-1.0.json
          echo "live_gold_injected_ephemerally=true"
          echo "live_insights_injected_ephemerally=true"
          echo "live_work_queue_injected_ephemerally=true"
          echo "live_insights_filename_decision=serve_1.1_contents_at_traffic-insights-1.0.json"

      - name: Build and verify live artifact
        shell: bash
        run: |
          npm --prefix traffic-intelligence run build
          test -f traffic-intelligence/dist/index.html
          test -f traffic-intelligence/dist/gold/canonical-gold-m1.2.json
          test -f traffic-intelligence/dist/gold/traffic-insights-1.0.json
          test -f traffic-intelligence/dist/gold/ti-work-queue-1.0.json
          test -f traffic-intelligence/dist/_worker.js
          test -f traffic-intelligence/dist/_headers
          test -f traffic-intelligence/dist/robots.txt
          node - <<'NODE'
          const fs = require("node:fs");
          const gold = JSON.parse(fs.readFileSync("traffic-intelligence/dist/gold/canonical-gold-m1.2.json", "utf8"));
          const insights = JSON.parse(fs.readFileSync("traffic-intelligence/dist/gold/traffic-insights-1.0.json", "utf8"));
          const workQueue = JSON.parse(fs.readFileSync("traffic-intelligence/dist/gold/ti-work-queue-1.0.json", "utf8"));
          if (gold.fixture !== false) throw new Error("built Gold must be live fixture=false");
          if (insights.fixture !== false) throw new Error("built insights must be live fixture=false");
          if (insights.contract_name !== "gfd-traffic-insights") throw new Error("built insights contract mismatch");
          if (insights.schema_version !== "1.1.0") throw new Error(`built insights must be schema 1.1.0, got ${insights.schema_version}`);
          if (!Array.isArray(insights.series) || insights.series.length === 0) throw new Error("built insights series empty");
          if (!Array.isArray(insights.briefs) || insights.briefs.length === 0) throw new Error("built insights must include briefs");
          if (!insights.estate_brief || typeof insights.estate_brief !== "object") throw new Error("built insights must include estate_brief");
          if (!Array.isArray(insights.property_health)) throw new Error("built insights must include property_health");
          if (!Array.isArray(insights.trend_comparisons)) throw new Error("built insights must include trend_comparisons");
          if (workQueue.contract_name !== "gfd-ti-work-queue") throw new Error("built work queue contract mismatch");
          if (workQueue.schema_version !== "1.1.0" && workQueue.schema_version !== "1.0.0") throw new Error(`built work queue schema mismatch: ${workQueue.schema_version}`);
          if (workQueue.fixture !== false) throw new Error("built work queue must be live fixture=false");
          console.log("live_build_gold_and_insights_verified=true");
          NODE

      - name: Verify Cloudflare deploy credential is available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_GFD_TI_DEPLOY_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "CF_GFD_TI_DEPLOY_TOKEN is not available to this workflow"
            exit 1
          }

      - name: Ensure isolated Pages project exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_GFD_TI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          project_url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME"
          response="$(curl -sS "$project_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

          if [ "$(jq -r '.success' <<<"$response")" = "true" ]; then
            echo "Pages project already exists: $CF_PROJECT_NAME"
            exit 0
          fi

          echo "Creating isolated Direct Upload Pages project: $CF_PROJECT_NAME"
          create_response="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"$CF_PROJECT_NAME\",\"production_branch\":\"main\"}")"

          jq '.' <<<"$create_response"
          test "$(jq -r '.success' <<<"$create_response")" = "true"

      - name: Deploy exact production artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_GFD_TI_DEPLOY_TOKEN }}
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy traffic-intelligence/dist \
            --project-name="$CF_PROJECT_NAME" \
            --branch=main

      - name: Ensure custom domain is attached
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_GFD_TI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          domain_url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/domains/$CF_CUSTOM_DOMAIN"
          response="$(curl -sS "$domain_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

          if [ "$(jq -r '.success' <<<"$response")" = "true" ]; then
            echo "Custom domain already attached: $CF_CUSTOM_DOMAIN"
            exit 0
          fi

          attach_response="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"$CF_CUSTOM_DOMAIN\"}")"

          jq '.' <<<"$attach_response"
          test "$(jq -r '.success' <<<"$attach_response")" = "true"

      - name: Ensure custom-domain DNS record exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_GFD_TI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          domain_url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/domains/$CF_CUSTOM_DOMAIN"
          domain_response="$(curl -sS "$domain_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          if [ "$(jq -r '.success' <<<"$domain_response")" != "true" ]; then
            echo "Unable to read Pages custom-domain state"
            jq '.' <<<"$domain_response"
            exit 1
          fi

          zone_id="$(jq -r '.result.zone_tag // empty' <<<"$domain_response")"
          test -n "$zone_id" || {
            echo "Pages custom domain did not expose a zone_tag"
            jq '.' <<<"$domain_response"
            exit 1
          }

          target="$CF_PROJECT_NAME.pages.dev"
          records_response="$(curl -sS -G \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "name=$CF_CUSTOM_DOMAIN")"
          if [ "$(jq -r '.success' <<<"$records_response")" != "true" ]; then
            echo "Unable to query DNS records for $CF_CUSTOM_DOMAIN"
            jq '.' <<<"$records_response"
            exit 1
          fi

          record_count="$(jq -r '.result | length' <<<"$records_response")"
          if [ "$record_count" -gt 1 ]; then
            echo "Multiple DNS records unexpectedly match $CF_CUSTOM_DOMAIN; refusing to mutate"
            jq '.result' <<<"$records_response"
            exit 1
          fi

          if [ "$record_count" -eq 1 ]; then
            existing_type="$(jq -r '.result[0].type' <<<"$records_response")"
            if [ "$existing_type" != "CNAME" ]; then
              echo "Existing non-CNAME DNS record conflicts with the required Pages CNAME"
              jq '.result[0]' <<<"$records_response"
              exit 1
            fi

            existing_target="$(jq -r '.result[0].content' <<<"$records_response")"
            existing_target="${existing_target%.}"
            existing_proxied="$(jq -r '.result[0].proxied' <<<"$records_response")"
            if [ "$existing_target" != "$target" ] || [ "$existing_proxied" != "true" ]; then
              echo "Existing CNAME conflicts with the required Pages target or proxy state"
              jq '.result[0]' <<<"$records_response"
              exit 1
            fi
            echo "DNS already correct: $CF_CUSTOM_DOMAIN -> $target (proxied)"
            exit 0
          fi

          echo "Creating proxied CNAME: $CF_CUSTOM_DOMAIN -> $target"
          create_response="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"type\":\"CNAME\",\"name\":\"$CF_CUSTOM_DOMAIN\",\"content\":\"$target\",\"proxied\":true,\"ttl\":1}")"
          jq '.' <<<"$create_response"
          test "$(jq -r '.success' <<<"$create_response")" = "true"

      - name: Verify Pages production URL
        shell: bash
        run: |
          set -euo pipefail
          pages_url="https://$CF_PROJECT_NAME.pages.dev"
          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors "$pages_url/" -o /tmp/traffic-index.html
          grep -q "GFD Traffic Intelligence" /tmp/traffic-index.html
          gold_status="$(curl -sS -o /tmp/pages-gold-denied.txt -w '%{http_code}' "$pages_url/gold/canonical-gold-m1.2.json")"
          test "$gold_status" = "401" || test "$gold_status" = "403"
          insights_status="$(curl -sS -o /tmp/pages-insights-denied.txt -w '%{http_code}' "$pages_url/gold/traffic-insights-1.0.json")"
          test "$insights_status" = "401" || test "$insights_status" = "403"
          work_status="$(curl -sS -o /tmp/pages-work-denied.txt -w '%{http_code}' "$pages_url/gold/ti-work-queue-1.0.json")"
          test "$work_status" = "401" || test "$work_status" = "403"
          echo "Verified production Gold + insights + work-queue admin wall: $pages_url"

      - name: Verify custom-domain activation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_GFD_TI_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          domain_url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/domains/$CF_CUSTOM_DOMAIN"
          status="unknown"
          verification="unknown"
          validation="unknown"
          response='{}'

          for attempt in $(seq 1 24); do
            response="$(curl -sS "$domain_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
            if [ "$(jq -r '.success // false' <<<"$response")" != "true" ]; then
              echo "Custom-domain API attempt $attempt returned success=false"
              jq '.' <<<"$response"
              sleep 5
              continue
            fi

            status="$(jq -r '.result.status // "unknown"' <<<"$response")"
            verification="$(jq -r '.result.verification_data.status // "unknown"' <<<"$response")"
            validation="$(jq -r '.result.validation_data.status // "unknown"' <<<"$response")"
            echo "Custom-domain attempt $attempt: status=$status verification=$verification validation=$validation"
            if [ "$status" = "active" ] && [ "$verification" = "active" ] && [ "$validation" = "active" ]; then
              break
            fi
            sleep 5
          done

          if [ "$status" != "active" ] || [ "$verification" != "active" ] || [ "$validation" != "active" ]; then
            echo "Custom domain did not reach complete active state: status=$status verification=$verification validation=$validation"
            jq '.' <<<"$response"
            exit 1
          fi

          echo "Custom domain active: https://$CF_CUSTOM_DOMAIN"
          echo "Direct HTTP curl is intentionally not a gate here because zone Bot Fight Mode rejects non-browser GitHub runners."
