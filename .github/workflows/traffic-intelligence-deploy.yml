name: Traffic Intelligence - Deploy

on:
  push:
    branches: [main]
    paths:
      - "traffic-intelligence/**"
      - ".github/workflows/traffic-intelligence-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traffic-intelligence-production
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: 3253d907ea85a18eb442283d7308b193
  CF_PROJECT_NAME: gfd-traffic-intelligence
  CF_CUSTOM_DOMAIN: traffic.goodflippindesign.com
  WRANGLER_VERSION: 4.129.0

jobs:
  deploy:
    name: Build, deploy, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FULL_ITHINK }}
      CLOUDFLARE_ACCOUNT_ID: 3253d907ea85a18eb442283d7308b193

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: traffic-intelligence/package-lock.json

      - name: Install Traffic Intelligence
        run: npm ci --prefix traffic-intelligence --no-audit

      - name: Validate Traffic Intelligence
        run: |
          npm --prefix traffic-intelligence run lint
          npm --prefix traffic-intelligence test
          npm --prefix traffic-intelligence run build
          test -f traffic-intelligence/dist/index.html
          test -f traffic-intelligence/dist/gold/canonical-gold-m1.2.json
          test -f traffic-intelligence/dist/_worker.js
          test -f traffic-intelligence/dist/_headers
          test -f traffic-intelligence/dist/robots.txt

      - name: Verify Cloudflare credential is available
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "CF_FULL_ITHINK is not available to this workflow"
            exit 1
          }

      - name: Ensure isolated Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          project_url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME"
          response="$(curl -sS "$project_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

          if [ "$(jq -r '.success' <<<"$response")" = "true" ]; then
            echo "Pages project already exists: $CF_PROJECT_NAME"
            exit 0
          fi

          echo "Creating isolated Direct Upload Pages project: $CF_PROJECT_NAME"
          create_response="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"$CF_PROJECT_NAME\",\"production_branch\":\"main\"}")"

          jq '.' <<<"$create_response"
          test "$(jq -r '.success' <<<"$create_response")" = "true"

      - name: Deploy exact production artifact
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy traffic-intelligence/dist \
            --project-name="$CF_PROJECT_NAME" \
            --branch=main

      - name: Ensure custom domain is attached
        shell: bash
        run: |
          set -euo pipefail
          domain_url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/domains/$CF_CUSTOM_DOMAIN"
          response="$(curl -sS "$domain_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

          if [ "$(jq -r '.success' <<<"$response")" = "true" ]; then
            echo "Custom domain already attached: $CF_CUSTOM_DOMAIN"
            exit 0
          fi

          attach_response="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"$CF_CUSTOM_DOMAIN\"}")"

          jq '.' <<<"$attach_response"
          test "$(jq -r '.success' <<<"$attach_response")" = "true"

      - name: Ensure custom-domain DNS record exists
        shell: bash
        run: |
          set -euo pipefail
          domain_url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/domains/$CF_CUSTOM_DOMAIN"
          domain_response="$(curl -sS "$domain_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          if [ "$(jq -r '.success' <<<"$domain_response")" != "true" ]; then
            echo "Unable to read Pages custom-domain state"
            jq '.' <<<"$domain_response"
            exit 1
          fi

          zone_id="$(jq -r '.result.zone_tag // empty' <<<"$domain_response")"
          test -n "$zone_id" || {
            echo "Pages custom domain did not expose a zone_tag"
            jq '.' <<<"$domain_response"
            exit 1
          }

          target="$CF_PROJECT_NAME.pages.dev"
          records_response="$(curl -sS -G \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "name=$CF_CUSTOM_DOMAIN")"
          if [ "$(jq -r '.success' <<<"$records_response")" != "true" ]; then
            echo "Unable to query DNS records for $CF_CUSTOM_DOMAIN"
            jq '.' <<<"$records_response"
            exit 1
          fi

          record_count="$(jq -r '.result | length' <<<"$records_response")"
          if [ "$record_count" -gt 1 ]; then
            echo "Multiple DNS records unexpectedly match $CF_CUSTOM_DOMAIN; refusing to mutate"
            jq '.result' <<<"$records_response"
            exit 1
          fi

          if [ "$record_count" -eq 1 ]; then
            existing_type="$(jq -r '.result[0].type' <<<"$records_response")"
            if [ "$existing_type" != "CNAME" ]; then
              echo "Existing non-CNAME DNS record conflicts with the required Pages CNAME"
              jq '.result[0]' <<<"$records_response"
              exit 1
            fi

            existing_target="$(jq -r '.result[0].content' <<<"$records_response")"
            existing_target="${existing_target%.}"
            existing_proxied="$(jq -r '.result[0].proxied' <<<"$records_response")"
            if [ "$existing_target" != "$target" ] || [ "$existing_proxied" != "true" ]; then
              echo "Existing CNAME conflicts with the required Pages target or proxy state"
              jq '.result[0]' <<<"$records_response"
              exit 1
            fi
            echo "DNS already correct: $CF_CUSTOM_DOMAIN -> $target (proxied)"
            exit 0
          fi

          echo "Creating proxied CNAME: $CF_CUSTOM_DOMAIN -> $target"
          create_response="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"type\":\"CNAME\",\"name\":\"$CF_CUSTOM_DOMAIN\",\"content\":\"$target\",\"proxied\":true,\"ttl\":1}")"
          jq '.' <<<"$create_response"
          test "$(jq -r '.success' <<<"$create_response")" = "true"

      - name: Verify Pages production URL
        shell: bash
        run: |
          set -euo pipefail
          pages_url="https://$CF_PROJECT_NAME.pages.dev"
          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors "$pages_url/" -o /tmp/traffic-index.html
          grep -q "GFD Traffic Intelligence" /tmp/traffic-index.html
          gold_status="$(curl -sS -o /tmp/pages-gold-denied.txt -w '%{http_code}' "$pages_url/gold/canonical-gold-m1.2.json")"
          test "$gold_status" = "401" || test "$gold_status" = "403"
          echo "Verified production artifact and admin wall: $pages_url"

      - name: Verify custom-domain activation
        shell: bash
        run: |
          set -euo pipefail
          domain_url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/domains/$CF_CUSTOM_DOMAIN"
          status="unknown"
          verification="unknown"
          validation="unknown"
          response='{}'

          for attempt in $(seq 1 24); do
            response="$(curl -sS "$domain_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
            if [ "$(jq -r '.success // false' <<<"$response")" != "true" ]; then
              echo "Custom-domain API attempt $attempt returned success=false"
              jq '.' <<<"$response"
              sleep 5
              continue
            fi

            status="$(jq -r '.result.status // "unknown"' <<<"$response")"
            verification="$(jq -r '.result.verification_data.status // "unknown"' <<<"$response")"
            validation="$(jq -r '.result.validation_data.status // "unknown"' <<<"$response")"
            echo "Custom-domain attempt $attempt: status=$status verification=$verification validation=$validation"
            if [ "$status" = "active" ] && [ "$verification" = "active" ] && [ "$validation" = "active" ]; then
              break
            fi
            sleep 5
          done

          if [ "$status" != "active" ] || [ "$verification" != "active" ] || [ "$validation" != "active" ]; then
            echo "Custom domain did not reach complete active state: status=$status verification=$verification validation=$validation"
            jq '.' <<<"$response"
            exit 1
          fi

          echo "Custom domain active: https://$CF_CUSTOM_DOMAIN"
          echo "Direct HTTP curl is intentionally not a gate here because zone Bot Fight Mode rejects non-browser GitHub runners."
