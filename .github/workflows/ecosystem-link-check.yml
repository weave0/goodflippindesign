name: Ecosystem Link Check

# Nightly probe of every public ecosystem property:
#   - HTTP 200 on root
#   - JSON-LD present + parses + references the studio @id
#   - Footer outbound links to sister properties resolve
# Also runs on PRs that touch index.html or workflow file.

on:
    schedule:
        - cron: "17 9 * * *" # 09:17 UTC daily (~03:17 / 04:17 CT)
    workflow_dispatch:
    pull_request:
        paths:
            - "index.html"
            - ".github/workflows/ecosystem-link-check.yml"
            - "scripts/validate-ecosystem-jsonld.ps1"

jobs:
    smoke:
        name: Ecosystem JSON-LD + link probe
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
            - uses: actions/checkout@v4

            - name: Validate JSON-LD + studio @id in local HTML files
              shell: bash
              run: |
                  # Reads checked-out files directly — avoids Cloudflare Bot Fight Mode
                  # which blocks GitHub Actions (Azure cloud) IPs with 403.
                  pages=(
                    "index.html"
                    "donate.html"
                    "gallery.html"
                    "music.html"
                    "music-shariff.html"
                    "music-djz.html"
                    "music-aardvarco.html"
                    "music-heavymoose-dross1.html"
                    "music-heavymoose-dross2.html"
                    "terms.html"
                    "privacy.html"
                  )
                  studio_id="https://goodflippindesign.com/#studio"
                  fail=0
                  for page in "${pages[@]}"; do
                    echo "::group::$page"
                    if [ ! -f "$page" ]; then
                      echo "::error::$page — file not found in repo"
                      fail=1
                      echo "::endgroup::"
                      continue
                    fi
                    if grep -q 'application/ld+json' "$page"; then
                      echo "JSON-LD block present"
                    else
                      echo "::error::$page — no JSON-LD block"
                      fail=1
                    fi
                    if grep -qF "$studio_id" "$page"; then
                      echo "studio @id referenced"
                    else
                      echo "::warning::$page — does NOT reference $studio_id"
                    fi
                    echo "::endgroup::"
                  done
                  exit $fail

            - name: Probe main domain HTTP liveness
              shell: bash
              run: |
                  # Cloudflare Bot Fight Mode returns 403 for GitHub Actions IPs.
                  # Treat 403 as "site is live but CF is blocking the CI bot" (warning).
                  # Only fail on real errors: 4xx (except 403), 5xx, or timeout.
                  fail=0
                  urls=(
                    "https://goodflippindesign.com/"
                    "https://goodflippindesign.com/music.html"
                    "https://goodflippindesign.com/terms.html"
                    "https://goodflippindesign.com/privacy.html"
                  )
                  for u in "${urls[@]}"; do
                    code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -L "$u" || echo "000")
                    if [[ "$code" =~ ^(200|301|302|307|308)$ ]]; then
                      echo "OK  $code  $u"
                    elif [[ "$code" == "403" ]]; then
                      echo "::warning::$u returned 403 (Cloudflare Bot Fight Mode — site is deployed, CI IPs are blocked)"
                    else
                      echo "::error::$u returned $code — possible outage"
                      fail=1
                    fi
                  done
                  exit $fail

            - name: Probe ecosystem outbound footer links
              shell: bash
              run: |
                  set -e
                  # Sister properties referenced from goodflippindesign.com footer.
                  # 200 OR 301/302 (redirects) acceptable; any 4xx/5xx fails the run.
                  targets=(
                    "https://goodflippinvibes.com"
                    "https://aiaimate.com"
                    "https://citizenapproved.org"
                    "https://culturesherpa.org"
                    "https://heavymoose.com"
                    "https://globaldeets.com"
                  )
                  fail=0
                  for t in "${targets[@]}"; do
                    code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -L "$t" || echo "000")
                    if [[ "$code" =~ ^(200|301|302|307|308)$ ]]; then
                      echo "OK  $code  $t"
                    else
                      echo "::error::$t returned $code"
                      fail=1
                    fi
                  done
                  exit $fail
