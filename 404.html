<!DOCTYPE html>
<!-- Cache bust: 2026-02-19 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Page Not Found | Good Flippin Design</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d0d;
      --text: #f5f5f5;
      --text-muted: #8a8a8a;
      --border: rgba(255,255,255,0.06);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(135deg, #f5f5f5 0%, #8a8a8a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.125rem;
      color: var(--text-muted);
      max-width: 480px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    a:hover { opacity: 0.75; }
    .btn-primary {
      background: #f5f5f5;
      color: #0d0d0d;
    }
    .btn-ghost {
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <p class="eyebrow">Good Flippin Design</p>
  <h1>404</h1>
  <p>This page doesn't exist (or moved). Try heading back home or visiting one of the links below.</p>
  <div class="links">
    <a href="/" class="btn-primary">← Back to Home</a>
    <a href="/donate" class="btn-ghost">Support the Mission</a>
    <a href="mailto:getsome@goodflippinvibes.com" class="btn-ghost">Contact Us</a>
  </div>
</body>
</html>
