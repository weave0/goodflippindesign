name = "gfd-auth"
main = "auth.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Previous entry point (blog/comments only):
# main = "auth-simple.js"

[[d1_databases]]
binding = "DB"
database_name = "gfd_community"
database_id = "a46ec9df-31b8-4285-845b-1fd3a62bd1b5"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "gfv-media"

[vars]
NODE_ENV = "production"
# Declare secret names as empty placeholders so miniflare/vitest can override them for tests.
# Real values are set (and take precedence) via `wrangler secret put <NAME>`.
STRIPE_WEBHOOK_SECRET   = ""   # production webhook runs in Pages: wrangler pages secret put STRIPE_WEBHOOK_SECRET --project-name goodflippindesign
INTERNAL_SECRET         = ""   # wrangler secret put INTERNAL_SECRET
CLERK_SECRET_KEY        = ""   # wrangler secret put CLERK_SECRET_KEY
CLERK_SECRET_KEY_GFD    = ""   # wrangler secret put CLERK_SECRET_KEY_GFD
# Mission Control. Real values are wrangler secrets and override these empty placeholders.
MISSION_CONTROL_GITHUB_TOKEN = ""
MISSION_CONTROL_CONTRACT_KEY = ""
MISSION_CONTROL_CONTRACT_KEY_ID = ""
MISSION_CONTROL_RESULT_KEY = ""
MISSION_CONTROL_RESULT_KEY_ID = ""
MISSION_CONTROL_RESULT_WORKER_ID = ""
MISSION_CONTROL_WORKER_TOKEN = ""
# SOCIAL_PUBLISHER_URL   — set via `wrangler secret put SOCIAL_PUBLISHER_URL`
# TOKEN_ENCRYPTION_KEY   — set via `wrangler secret put TOKEN_ENCRYPTION_KEY`
# SENTRY_DSN             — Error tracking DSN (get from sentry.io → Settings → Projects → DSN)
#                          When set, auth.js sends Worker errors to Sentry automatically
#                          Run: wrangler secret put SENTRY_DSN --name gfd-auth
