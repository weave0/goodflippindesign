<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth Diagnostic — GFD</title>
  <style>
    body {
      font-family: monospace;
      background: #0d0d0d;
      color: #f5f5f5;
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      color: #7c5cbf;
      margin-bottom: 0.5rem;
    }

    .status {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin: 0.5rem 0;
      font-size: 0.9rem;
      word-break: break-all;
    }

    .ok {
      background: #0d2e1a;
      border: 1px solid #1a7a3a;
      color: #4ade80;
    }

    .err {
      background: #2e0d0d;
      border: 1px solid #7a1a1a;
      color: #f87171;
    }

    .info {
      background: #0d1e2e;
      border: 1px solid #1a4a7a;
      color: #93c5fd;
    }

    .warn {
      background: #2e1e0d;
      border: 1px solid #7a4a1a;
      color: #fbbf24;
    }

    button {
      background: #7c5cbf;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      margin: 0.5rem 0.25rem;
      font-size: 1rem;
      min-width: 200px;
    }

    button:hover {
      background: #6348a8;
    }

    button:disabled {
      background: #444;
      cursor: not-allowed;
    }

    #log {
      margin-top: 1rem;
    }

    .section {
      margin: 2rem 0 1rem;
      border-top: 1px solid #333;
      padding-top: 1rem;
      color: #8a8a8a;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    pre {
      white-space: pre-wrap;
      background: #111;
      padding: 1rem;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #a0aec0;
      overflow-x: auto;
    }

    a {
      color: #93c5fd;
    }
  </style>
</head>

<body>
  <h1>OAuth Diagnostic</h1>
  <p style="color:#8a8a8a; font-size:0.85rem;">Tests Clerk OAuth flows in real browser context. Open DevTools console for full error details.</p>

  <div class="section">1. Clerk Initialization</div>
  <div id="init-status" class="status info">Waiting for Clerk JS to load...</div>

  <div class="section">2. Test OAuth Flows (will redirect — open in new tab first)</div>
  <button id="btn-google" disabled onclick="testOAuth('google')">Test Google Sign-In</button>
  <button id="btn-linkedin" disabled onclick="testOAuth('linkedin')">Test LinkedIn Sign-In</button>
  <button id="btn-email" disabled onclick="testEmail()">Test Email Sign-In</button>

  <div class="section">3. Environment Info</div>
  <div id="env-info">Loading...</div>

  <div class="section">4. Log</div>
  <div id="log"></div>

  <script>
    window.CLERK_PUBLISHABLE_KEY = 'pk_live_Y2xlcmsuZ29vZGZsaXBwaW52aWJlcy5jb20k';
    const REDIRECT_URL = window.location.href;

    function log(msg, type = 'info') {
      const div = document.createElement('div');
      div.className = 'status ' + type;
      div.textContent = '[' + new Date().toISOString().substr(11, 8) + '] ' + msg;
      document.getElementById('log').prepend(div);
      console.log('[OAuth Diag]', type.toUpperCase(), msg);
    }

    async function testOAuth(provider) {
      const strategyMap = { google: 'oauth_google', linkedin: 'oauth_linkedin_oidc' };
      const strategy = strategyMap[provider];
      log('Starting ' + provider + ' OAuth → strategy: ' + strategy, 'info');
      try {
        if (!window.__clerk) { log('Clerk not initialized', 'err'); return; }
        log('Calling authenticateWithRedirect for ' + strategy + '...', 'info');
        await window.__clerk.authenticateWithRedirect({
          strategy,
          redirectUrl: REDIRECT_URL,
          redirectUrlComplete: REDIRECT_URL,
        });
        log(provider + ' redirect initiated (you should be redirecting now)', 'ok');
      } catch (e) {
        log(provider + ' FAILED: ' + (e.message || JSON.stringify(e)), 'err');
        if (e.errors) {
          e.errors.forEach(err => log('  → ' + err.code + ': ' + err.long_message, 'err'));
        }
        console.error('[OAuth Diag] ' + provider + ' error:', e);
      }
    }

    async function testEmail() {
      try {
        await window.__clerk.redirectToSignIn({ redirectUrl: REDIRECT_URL });
      } catch (e) {
        log('Email redirect failed: ' + e.message, 'err');
      }
    }

    // Load Clerk JS
    const key = window.CLERK_PUBLISHABLE_KEY;
    const b64 = key.replace(/^pk_(live|test)_/, '');
    const padded = b64 + '====='.slice(0, (4 - b64.length % 4) % 4);
    const frontendApi = atob(padded).replace(/\$$/, '');
    const script = document.createElement('script');
    script.src = 'https://' + frontendApi + '/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.setAttribute('data-clerk-publishable-key', key);

    script.onload = async () => {
      log('Clerk JS @5 loaded', 'ok');
      try {
        const clerk = window.Clerk;
        window.__clerk = clerk;

        log('Mounting Clerk...', 'info');
        await clerk.load({ standardBrowser: true });
        log('Clerk loaded successfully', 'ok');

        const initDiv = document.getElementById('init-status');
        initDiv.className = 'status ok';
        initDiv.textContent = '✓ Clerk initialized — publishable key: ' + window.CLERK_PUBLISHABLE_KEY.substr(0, 30) + '...';

        // Enable buttons
        document.getElementById('btn-google').disabled = false;
        document.getElementById('btn-linkedin').disabled = false;
        document.getElementById('btn-email').disabled = false;

        // Show session state
        const state = clerk.session
          ? '✓ Active session — user: ' + (clerk.user?.primaryEmailAddress?.emailAddress || clerk.user?.id)
          : '○ No active session (not signed in)';
        log('Session state: ' + state, clerk.session ? 'ok' : 'warn');

        // Check if we just came back from OAuth
        const url = new URL(window.location.href);
        if (url.searchParams.has('__clerk_status')) {
          const status = url.searchParams.get('__clerk_status');
          log('OAuth callback detected — __clerk_status: ' + status, status === 'verified' ? 'ok' : 'warn');
          if (url.searchParams.has('__clerk_error')) {
            log('OAuth error param: ' + decodeURIComponent(url.searchParams.get('__clerk_error')), 'err');
          }
        }

        // Environment info
        document.getElementById('env-info').innerHTML = `
        <pre>Frontend API: clerk.goodflippinvibes.com
OAuth Callback URL: https://clerk.goodflippinvibes.com/v1/oauth_callback

Required in Google GCP Console (OAuth Client ID):
  Authorized redirect URI: https://clerk.goodflippinvibes.com/v1/oauth_callback
  OAuth Consent Screen: must be PUBLISHED (not Testing mode)
  Client ID in Clerk: 422907979186-qvmiis3p3tc3j40r7feb69d5343iqek3.apps.googleusercontent.com

Required in LinkedIn Developer Portal:
  Product: "Sign In with LinkedIn using OpenID Connect" (NOT legacy)
  Authorized redirect URL: https://clerk.goodflippinvibes.com/v1/oauth_callback

Fix Links:
  Google GCP Console → https://console.cloud.google.com/apis/credentials?project=422907979186
  Google Consent Screen → https://console.cloud.google.com/apis/credentials/consent?project=422907979186
  LinkedIn Dev Portal → https://developer.linkedin.com/apps</pre>`;

      } catch (e) {
        const initDiv = document.getElementById('init-status');
        initDiv.className = 'status err';
        initDiv.textContent = '✗ Clerk failed to load: ' + e.message;
        log('Clerk initialization error: ' + e.message, 'err');
        if (e.errors) e.errors.forEach(er => log('  ' + er.code + ': ' + er.long_message, 'err'));
        console.error('[OAuth Diag] Clerk load error:', e);
      }
    };

    script.onerror = () => {
      document.getElementById('init-status').className = 'status err';
      document.getElementById('init-status').textContent = '✗ Failed to load Clerk JS from CDN';
      log('Clerk JS CDN failed to load', 'err');
    };

    document.head.appendChild(script);
  </script>
</body>

</html>
