<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Google Analytics Test</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QPPVJM1B60"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-QPPVJM1B60');

        // Test if GA loaded successfully
        window.addEventListener('load', function () {
            setTimeout(function () {
                if (typeof gtag === 'function' && window.dataLayer) {
                    document.getElementById('status').innerHTML = '<strong style="color: green;">✅ Google Analytics is WORKING!</strong><br>gtag function exists<br>dataLayer initialized';
                } else {
                    document.getElementById('status').innerHTML = '<strong style="color: red;">❌ Google Analytics BLOCKED</strong><br>Check Content Security Policy';
                }
            }, 2000);
        });
    </script>
</head>

<body style="font-family: Arial; padding: 40px; background: #0a0e1a; color: #f1f5f9;">
    <h1>Google Analytics Test Page</h1>
    <div id="status">⏳ Testing Google Analytics...</div>
    <hr style="margin: 30px 0; border-color: #333;">
    <h3>Instructions:</h3>
    <ol>
        <li>Deploy this test page to your site</li>
        <li>Open browser DevTools → Network tab</li>
        <li>Look for requests to <code>googletagmanager.com</code></li>
        <li>Check Console for any CSP errors</li>
    </ol>
</body>

</html>
